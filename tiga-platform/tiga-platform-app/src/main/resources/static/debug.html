<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Tiga Debugger | 专业版变量视图</title>
    <link rel="stylesheet" href="./js/monaco/scripts/debug/jquery.json-viewer.css">
    <script src="./js/monaco/scripts/debug/jquery-3.6.0.min.js"></script>
    <script src="./js/monaco/scripts/debug/jquery.json-viewer.js"></script>
    <script src="./js/monaco/loader.min.js"></script>
    
    <style>
        :root {
            --bg-main: #181818;
            --bg-side: #1e1e1e;
            --bg-toolbar: #2d2d2d;
            --accent: #007acc;
            --accent-hover: #0062a3;
            --border: #333333;
            --text-main: #cccccc;
            --text-muted: #858585;
            --success: #388e3c;
            --danger: #d32f2f;
            --error-bg: #420b0b;
        }

        body { 
            margin: 0; 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        .toolbar { 
            padding: 8px 16px; 
            background: var(--bg-toolbar); 
            display: flex; 
            align-items: center;
            gap: 12px; 
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .btn-group { display: flex; gap: 4px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 6px; }

        button { 
            display: flex; align-items: center; gap: 6px;
            cursor: pointer; border: none; padding: 6px 12px; 
            border-radius: 4px; color: white; font-size: 13px;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
        button:disabled { opacity: 0.3; cursor: not-allowed; filter: grayscale(1); }

        #app { flex: 1; display: flex; overflow: hidden; }
        .editor-container { flex: 1.5; border-right: 1px solid var(--border); position: relative; }
        
        .sidebar { flex: 1; display: flex; flex-direction: column; background: #2b2b2b; min-width: 350px; }
        .side-header { 
            padding: 10px 15px; background: rgba(0,0,0,0.1); 
            font-size: 11px; color: var(--text-muted); 
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between;
        }

        #json-renderer { 
            flex: 1; padding: 15px; overflow: auto; 
            font-family: 'Fira Code', monospace; font-size: 13px;
            padding-left: 22px;
        }
        
        .error-display {
            background: var(--error-bg);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            border-left: 4px solid var(--danger);
            white-space: pre-wrap;
            margin: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .status-bar {
            padding: 4px 15px;
            background: var(--accent);
            color: white;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        #metrics-panel { display: flex; gap: 20px; }
        .metric-item b { color: #fff; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 3px; }

        .line-highlight { background: rgba(255, 255, 0, 0.15); border-left: 3px solid #ffcc00; }
        .breakpoint-glyph { left:10px!important; background: #e51400; border-radius: 50%; width: 16px!important; height: 16px!important; cursor: pointer!important;top: 4px; z-index: 2;}
        .monaco-editor .margin-view-overlays .line-numbers{ left: 0px !important; }
        .json-string{color:#e7ebe6;}
        .json-literal{color:#e7ebe6;}
        .monaco-editor .margin-view-overlays .line-numbers{width: 60px !important;}
        #json-controls a {
		    font-size: 10px;
		    padding: 2px 4px;
		    border-radius: 3px;
		    background: rgba(255,255,255,0.05);
		    transition: background 0.2s;
		}
		#json-controls a:hover {
		    background: rgba(255,255,255,0.15);
		    color: #fff !important;
		}
    </style>
</head>
<body>

    <div class="toolbar">
        <div style="font-weight: bold; color: #fff; margin-right: 10px; display: flex; align-items: center; gap: 8px;">
            Tiga Debug
        </div>
        
        <div class="btn-group">
            <button onclick="Debugger.start()" style="background: var(--success)">▶ 执行</button>
        </div>

        <div class="btn-group">
            <button id="resumeBtn" onclick="Debugger.resume()" disabled style="background: var(--accent)">⬇ 继续</button>
            <button id="stepBtn" onclick="Debugger.step()" disabled style="background: #555">⤵ 下一步</button>
        </div>

        <button id="stopBtn" onclick="Debugger.stop()" disabled style="background: var(--danger)">⚪ 停止</button>

        <span id="wsStatus" style="margin-left:auto; font-size:12px; display:flex; align-items:center; gap:5px;">
            <span style="width:8px; height:8px; background:#aaa; border-radius:50%"></span> 准备就绪
        </span>
    </div>

    <div id="app">
        <div id="editor" class="editor-container"></div>
        <div class="sidebar">
            <div class="side-header">
			    <span id="view-title">Variables / 变量快照</span>
			    <div style="display: flex; gap: 8px; align-items: center;">
			        <div id="json-controls" style="display: none; gap: 5px;">
			            <a href="javascript:void(0)" onclick="Debugger.toggleJson(true)" style="color: var(--accent); text-decoration: none;">全部展开</a>
			            <span style="color: #444;">|</span>
			            <a href="javascript:void(0)" onclick="Debugger.toggleJson(false)" style="color: var(--accent); text-decoration: none;">全部折叠</a>
			        </div>
			        <span id="last-update">--:--:--</span>
			    </div>
			</div>
            <div id="json-renderer">-- 等待脚本运行 --</div>
        </div>
    </div>

    <div class="status-bar">
        <div id="metrics-panel">
            <span class="metric-item">编译数: <b id="m-count">0 / 3000</b></span>
            <span class="metric-item">Metaspace: <b id="m-meta">0MB</b></span>
        </div>
        <div id="lang-info">Groovy Engine v2.4</div>
    </div>

    <script>
	
        const Debugger = {
            sid: "sid_" + Math.random().toString(36).substr(2, 9),
            ws: null,
            editor: null,
            decorations: [],
            breakpointIds: [], // 存储 Monaco 的 Decoration ID
            _isRegistered: false, // 标记位：防止重复注册全局语言特性
            // 全局变量及其对应的全路径类名映射
            globalVars: {
                'db': 'java.util.Map<java.lang.String, com.ocean.tigaapi.db.DbModule>'
            },
            // 用于存储 全局组件库 别名： Map 类型的 Key 列表
            mapKeysCache: {
                'db': []
            },

            classCache: {}, // 类元数据缓存（存储从后端获取的方法、文档等）
            allClasses: [], // 存储所有从后端加载的全路径类名列表（用于导入提示）

            init() {
            	this.language = 'groovy';
            	this.getModuleKeys();
                this.initMonaco();
                this.initWebSocket();
            },

            initMonaco() {
                require.config({
                    paths: { 'vs': './js/monaco/vs' },
                    'vs/nls': { availableLanguages: { '*': 'zh-cn' } }
                });
                require([
	                './js/monaco/scripts/editor/default-theme.js',
	                './js/monaco/scripts/editor/dark-new-theme.js',
	                './js/monaco/scripts/editor/high-light.js',
	                './js/monaco/scripts/editor/mybatis.js',
	                './js/monaco/scripts/editor/completion.js',
	                './js/monaco/scripts/beautifier/javascript/beautifier.js',
	                'vs/editor/editor.main'
	            ], function (defTheme,darkTheme, HighLightOptions, mybatis, CompletionItemProvider, Beautifier) {
                	
                	// 仅在未注册时执行语言特性注册
                    if (!Debugger._isRegistered) {
                        mybatis();
                        // 定义并注册主题与语言
                        monaco.editor.defineTheme('darkTheme', darkTheme.editor);
                        monaco.editor.defineTheme('defTheme', defTheme.editor);
                        
                        monaco.languages.register({ id: Debugger.language });
                        monaco.languages.setMonarchTokensProvider(Debugger.language, HighLightOptions);
                        monaco.languages.registerCompletionItemProvider(Debugger.language, CompletionItemProvider);
                        
                        // 语言交互特性配置
                        monaco.languages.setLanguageConfiguration(Debugger.language, {
                            wordPattern: /(-?\d*\.\d\w*)|([^`~!#%^&*()\-=+[{\]}\\|;:'",.<>/?\s]+)/g,
                            brackets: [['{', '}'], ['[', ']'], ['(', ')']],
                            onEnterRules: [
                                // 回车时自动补全 Javadoc 格式
                                {
                                    beforeText: /^\s*\/\*\*(?!\/)([^\*]|\*(?!\/))*$/,
                                    afterText: /^\s*\*\/$/,
                                    action: { indentAction: monaco.languages.IndentAction.IndentOutdent, appendText: ' * ' }
                                },
                                {
                                    beforeText: /^\s*\/\*\*(?!\/)([^\*]|\*(?!\/))*$/,
                                    action: { indentAction: monaco.languages.IndentAction.None, appendText: ' * ' }
                                }
                            ],
                            comments: { lineComment: '//', blockComment: ['/*', '*/'] },
                            operators: ['<=', '>=', '==', '!=', '+', '-', '*', '/', '%', '&', '|', '!', '&&', '||', '?', ':', '++', '--', '+=', '-=', '*=', '/='],
                            autoClosingPairs: [
                                { open: '{', close: '}' }, { open: '[', close: ']' }, { open: '(', close: ')' },
                                { open: '"""', close: '"""', notIn: ['string.multi'] },
                                { open: '"', close: '"', notIn: ['string'] },
                                { open: '\'', close: '\'', notIn: ['string'] },
                                { open: '/**', close: ' */', notIn: ['string'] }
                            ],
                        });

                        // 注册文档格式化器
                        monaco.languages.registerDocumentFormattingEditProvider(Debugger.language, {
                            provideDocumentFormattingEdits(model) {
                                return [{
                                    text: new Beautifier(model.getValue()).beautify(),
                                    range: model.getFullModelRange()
                                }]
                            }
                        });

                        // 启动各级增强服务
                        Debugger.registerCompletion(monaco);
                        Debugger.registerHover(monaco);
                        Debugger.registerSignatureHelp(monaco);
                        Debugger.preloadAllClasses();
                        
                        Debugger._isRegistered = true;
                    }
                	
                    if(Debugger.language == 'groovy'){
                    	Debugger.initGroovyIntellisense()
                    }
	
                	 
                    Debugger.editor = monaco.editor.create(document.getElementById('editor'), {
                        value: 'import com.ocean.tigaapi.api.entity.ApiEntity;\n\n// 脚本调试区\nvar a = db._.table("tiga_api").selectList("*", ApiEntity.class);\n\nreturn a;',
                        language: Debugger.language,
                        theme: 'darkTheme',
                        glyphMargin: true,
                        automaticLayout: true,
                        fontSize: 16,
	                    fixedOverflowWidgets: true,
	                    minimap: { enabled: false },
		                scrollBeyondLastLine: false,
		                fontFamily: 'JetBrainsMono, Consolas, "Courier New",monospace, 微软雅黑',
		    			fontLigatures: true,
		                wordWrap: 'on',
		                lineNumbers: 'on',
		                lineDecorationsWidth: 15,
		                renderWhitespace: 'none',
		                roundedSelection: false,
		                scrollbar: { vertical: 'visible', horizontal: 'visible', useShadows: false }
                    });

                    // 核心优化：内容变更时验证断点有效性
                    Debugger.editor.onDidChangeModelContent(() => {
                    	Debugger.syncAndValidateBreakpoints();
                    });

                    // 点击添加/删除断点
                    Debugger.editor.onMouseDown(e => {
                        if (e.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN) {
                        	Debugger.toggleBreakpoint(e.target.position.lineNumber);
                        }
                    });
                    
                 	// 注册追加头部命令（用于自动 import）
		            this.monaco.editor.registerCommand('editor.action.appendHead', (_c, text) => {
		    			if(Debugger.editor.getValue()?.indexOf(text) > -1){ return }
		    			Debugger.editor.executeEdits('', [{
		    				forceMoveMarkers: true,
		    				text:text,
		    				range: new monaco.Range(1, 0, 1, 0)
		    			}])
		    		});
	
		            // 绑定快捷键动作
		    		Debugger.editor.addAction({
					  id: 'editor.action.triggerSuggest.extension',
					  label: '触发代码提示',
					  keybindings: [ monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, monaco.KeyMod.Alt | monaco.KeyCode.Enter ],
					  run: function() { Debugger.editor.trigger(null, 'editor.action.triggerSuggest'); }
					});
					
		    		Debugger.editor.addAction({
					    id: 'editor.action.foldAll.extension',
					    label: '全部折叠',
					    keybindings: [ monaco.KeyMod.Alt | monaco.KeyCode.BracketLeft ],
					    run: function() { Debugger.editor.getAction('editor.foldAll').run(); }
					});
					
		    		Debugger.editor.addAction({
					    id: 'editor.action.unfoldAll.extension',
					    label: '全部展开',
					    keybindings: [ monaco.KeyMod.Alt | monaco.KeyCode.BracketRight ],
					    run: function() { Debugger.editor.getAction('editor.unfoldAll').run(); }
					});
		    		
		    		// 脚本保存 快捷键
					Debugger.editor.addAction({
					    id: 'tiga.savescript.action',
					    label: '保存',
					    keybindings: [
					        monaco.KeyMod.Alt | monaco.KeyCode.KeyS,
					        monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS,
					    ],
					    run: async(ed) =>{
					        /* if(modifiedSet.value.has(scriptId)){
								const status =  await TigaEditorManager.Request('/tiga/api/save', 'POST', {id:scriptId,script:ed.getValue()});
			                    if (status){
									modifiedSet.value.delete(scriptId);
								}
							 }*/
					    }
					});
	
	                // 全局 Promise 错误拦截
					if (!window.hasMonacoErrorHandler) {
					    window.addEventListener('unhandledrejection', function (event) {
					        if (event.reason && (event.reason.name === 'Canceled')) event.preventDefault();
					    });
					    window.hasMonacoErrorHandler = true;
					}
					
			        window.addEventListener('resize', function() { if (this.editor) Debugger.editor.layout(); });
	
                });
            },

            // 验证并清理空行断点
            syncAndValidateBreakpoints() {
                const model = Debugger.editor.getModel();
                if (!model) return;

                const currentDecorations = Debugger.editor.getLineDecorations(1); // 获取所有装饰
                const newBreakpointIds = [];
                const toRemove = [];

                // 遍历当前所有断点 Decoration
                this.breakpointIds.forEach(id => {
                    const range = model.getDecorationRange(id);
                    if (range) {
                        const line = range.startLineNumber;
                        const content = model.getLineContent(line).trim();
                        
                        // 如果内容被清空或只剩空格，标记为移除
                        if (content === '') {
                            toRemove.push(id);
                        } else {
                            newBreakpointIds.push(id);
                        }
                    } else {
                        // 如果 Range 已经消失（行被物理删除）
                        toRemove.push(id);
                    }
                });

                // 执行删除
                if (toRemove.length > 0) {
                	Debugger.editor.deltaDecorations(toRemove, []);
                    this.breakpointIds = newBreakpointIds;
                }
            },

            // 获取当前所有有效的断点行号（供执行时发送给后端）
            getBreakpointLines() {
                const model = Debugger.editor.getModel();
                const lines = [];
                this.breakpointIds.forEach(id => {
                    const range = model.getDecorationRange(id);
                    if (range) lines.push(range.startLineNumber);
                });
                return [...new Set(lines)]; // 去重
            },

            toggleBreakpoint(line) {
                const model = Debugger.editor.getModel();
                const lineContent = model.getLineContent(line).trim();
                if (lineContent === '') return;

                const existingDecoration = Debugger.editor.getLineDecorations(line).find(d => 
                    this.breakpointIds.includes(d.id)
                );

                let action = 'add'; // 默认动作

                if (existingDecoration) {
                    Debugger.editor.deltaDecorations([existingDecoration.id], []);
                    this.breakpointIds = this.breakpointIds.filter(id => id !== existingDecoration.id);
                    action = 'remove'; // 已存在则移除
                } else {
                    const newIds = Debugger.editor.deltaDecorations([], [{
                        range: new monaco.Range(line, 1, line, 1),
                        options: { 
                            glyphMarginClassName: 'breakpoint-glyph',
                            stickiness: monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges
                        }
                    }]);
                    this.breakpointIds.push(newIds[0]);
                    action = 'add';
                }

                // --- 核心修改：实时通知后端 ---
                fetch(`/debug/breakpoint/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sid: this.sid, line: line })
                }).catch(err => console.error("同步断点失败", err));
            },

            initWebSocket() {
                const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
                this.ws = new WebSocket(`${protocol}://${location.host}/debug-ws?sid=${this.sid}`);
                this.ws.onopen = () => this.updateWsStatus('在线', '#28a745');
                this.ws.onclose = () => this.updateWsStatus('离线', '#d9534f');
                this.ws.onmessage = (e) => this.handleWsMessage(JSON.parse(e.data));
            },

            handleWsMessage(msg) {
                switch(msg.type) {
                    case 'BREAKPOINT_HIT':
                        this.updateViewTitle("Variables / 变量断点");
                        this.renderVariables(msg.data.vars);
                        this.highlightLine(msg.data.line);
                        this.setControlsEnabled(true);
                        break;
                    case 'FINISHED':
                        this.updateViewTitle("Result / 执行结果");
                        this.renderVariables(msg.data); 
                        this.resetUI(false); 
                        break;
                    case 'ERROR':
                        this.updateViewTitle("Error / 运行时错误");
                        this.renderError(msg.data);
                        this.resetUI(false);
                        break;
                }
            },

            async start() {
                if(this.ws.readyState !== WebSocket.OPEN) this.initWebSocket();
                this.resetUI(true);
                $('#json-renderer').html('<div style="color:var(--accent)">🚀 正在初始化脚本...</div>');
                
                try {
                    await fetch('/debug/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            sid: this.sid, 
                            code: Debugger.editor.getValue(), 
                            type: Debugger.language,
                            // 动态获取当前的行号
                            breakpoints: this.getBreakpointLines() 
                        })
                    });
                    document.getElementById('stopBtn').disabled = false;
                } catch (err) {
                    this.renderError("请求失败: " + err.message);
                }
            },

            resume() { this.apiAction('resume'); },
            step() { this.apiAction('step'); },
            stop() { this.apiAction('stop'); this.resetUI(true); },

            async apiAction(action) {
                this.clearHighlights();
                this.setControlsEnabled(false);
                await fetch(`/debug/${action}?sid=${this.sid}`);
            },
         	// 在 Debugger 对象内添加
            toggleJson(expand) {
                if (expand) {
                    // 模拟点击 jquery.json-viewer 中的展开按钮
                    $('#json-renderer a.json-toggle').not('.collapsed').next().show(); // 确保显示
                    $('#json-renderer a.json-toggle').removeClass('collapsed');
                    // 如果插件支持重新渲染，也可以重新调用：
                     this.renderVariables(this._lastData, false); 
                } else {
                    $('#json-renderer a.json-toggle').addClass('collapsed').next().hide();
                }
            },
            _lastData: null,
            renderVariables(rawInput) {
                let dataToRender;
                this._lastData = rawInput; // 记录数据
                if (typeof rawInput === 'string') {
                    try {
                        dataToRender = JSON.parse(rawInput);
                    } catch (e) {
                        dataToRender = { value: rawInput };
                    }
                } else {
                    dataToRender = rawInput || { status: "empty" };
                }

                const deepUnpack = (obj) => {
                    if (obj === null || obj === undefined) return obj;
                    if (typeof obj === 'string') {
                        if ((obj.startsWith('{') && obj.endsWith('}')) || (obj.startsWith('[') && obj.endsWith(']'))) {
                            try {
                                const parsed = JSON.parse(obj);
                                return deepUnpack(parsed);
                            } catch (e) { return obj; }
                        }
                        return obj;
                    }
                    if (Array.isArray(obj)) return obj.map(deepUnpack);
                    if (typeof obj === 'object') {
                        delete obj['@type'];
                        const result = {};
                        for (let key in obj) {
                            result[key] = deepUnpack(obj[key]);
                        }
                        return result;
                    }
                    return obj;
                };
             	// 显示控制按钮
                document.getElementById('json-controls').style.display = 'flex';
                const finalData = deepUnpack(dataToRender);
                $('#json-renderer').empty().jsonViewer(finalData, { 
                    collapsed: false,// 默认展开第一层
                    withQuotes: true,
                    withLinks: false
                });
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            },

            renderError(errorInfo) {
                const html = `
                    <div class="error-display">
                        <div style="color:#ff5252;text-align: center;">⚠ 运行异常</div><br>
                        <div>${errorInfo}</div>
                    </div>
                `;
                $('#json-renderer').html(html);
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            },

            updateViewTitle(text) {
                document.getElementById('view-title').innerText = text;
            },

            highlightLine(line) {
                this.decorations = Debugger.editor.deltaDecorations(this.decorations, [{
                    range: new monaco.Range(line, 1, line, 1),
                    options: { isWholeLine: true, className: 'line-highlight' }
                }]);
                Debugger.editor.revealLineInCenter(line);
            },

            setControlsEnabled(enabled) {
                document.getElementById('resumeBtn').disabled = !enabled;
                document.getElementById('stepBtn').disabled = !enabled;
            },

            resetUI(clearSidebar) {
                this.setControlsEnabled(false);
                document.getElementById('stopBtn').disabled = true;
                this.clearHighlights();
                if (clearSidebar) {
                    this.updateViewTitle("Variables / 变量快照");
                    $('#json-renderer').html('<div style="color:#666">-- 等待运行 --</div>');
                 	// 隐藏控制按钮
                    document.getElementById('json-controls').style.display = 'none';
                }
            },

            clearHighlights() {
                this.decorations = Debugger.editor.deltaDecorations(this.decorations, []);
            },

            updateWsStatus(text, color) {
                const el = document.getElementById('wsStatus');
                el.innerHTML = `<span style="width:8px; height:8px; background:${color}; border-radius:50%"></span> ${text}`;
            },

         	// 注册提示Groovy项提供程序
            initGroovyIntellisense() {
                monaco.languages.registerCompletionItemProvider('groovy', {
                    provideCompletionItems: (model, position) => {
                        const word = model.getWordUntilPosition(position);
                        const range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber: position.lineNumber,
                            startColumn: word.startColumn,
                            endColumn: word.endColumn
                        };

                        // 准备提示数据
                        const suggestions = [
                            // 常用关键字
                            ...['def', 'var','return', 'while', 'new'].map(k => ({
                                label: k,
                                kind: monaco.languages.CompletionItemKind.Keyword,
                                insertText: k,
                                range: range
                            })),
                            // Groovy 常用方法
                            {
                                label: 'println',
                                kind: monaco.languages.CompletionItemKind.Function,
                                insertText: 'println(${1:obj})',
                                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                                detail: '打印到控制台',
                                range: range
                            },
                            {
                                label: 'collect',
                                kind: monaco.languages.CompletionItemKind.Method,
                                insertText: 'collect { ${1:it} -> ${2} }',
                                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                                detail: '遍历并收集结果 (List/Map)',
                                range: range
                            },
                            {
                                label: 'each',
                                kind: monaco.languages.CompletionItemKind.Method,
                                insertText: 'each { ${1:it} -> ${2} }',
                                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                                detail: '迭代处理',
                                range: range
                            }
                        ];

                        return { suggestions: suggestions };
                    }
                });
            },
            
            //-------------------------------------------------------------------------------

            /**
             * 预加载后端所有全路径类名
             */
            async preloadAllClasses() {
                try {
                    const txt = await fetch('/tiga/meta/classes.txt').then(r => r.text());
                    this.allClasses = this.parseCompressedText(txt);
                } catch (e) { console.error('Failed to load classes.txt', e); }
            },

            /**
             * 解析压缩格式的类名文本
             * @param {string} txt 格式为 "pkg:cls1,cls2"
             */
            parseCompressedText(txt) {
                const result = [];
                if (!txt) return result;
                txt.split('\n').forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx < 0) return;
                    const pkg = line.substring(0, idx);
                    line.substring(idx + 1).split(',').forEach(c => {
                        const cls = c.trim();
                        if (cls) result.push(pkg ? (pkg + '.' + cls) : cls);
                    });
                });
                return result;
            },

            /**
             * 注册自动补全提供
             */
            registerCompletion(monaco) {
                const self = this;
                monaco.languages.registerCompletionItemProvider(Debugger.language, {
                    triggerCharacters: ['.', ' ', '='],
                    provideCompletionItems: async (model, position) => {
                        const line = model.getLineContent(position.lineNumber);
                        const prefix = line.substring(0, position.column);
                        const word = model.getWordUntilPosition(position);

                        // --- 1. 处理多级调用 (如 db.master.isAl) ---
                        const multiMatch = prefix.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]*)$/);
                        if (multiMatch) {
                            const rootVar = multiMatch[1];
                            const subPath = multiMatch[2];
                            const className = self.inferClassName(model, rootVar, subPath);
                            if (className) {
                                const res = await self.getMethodSuggestions(className, monaco, model, position);
                                res.suggestions.forEach(s => s.sortText = '100_' + s.label);
                                return res;
                            }
                        }

                        // --- 2. 处理基础的对象/Map调用 (如 db. 或 a.) ---
                        const dotMatch = prefix.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]*)$/);
                        if (dotMatch) {
                            const varName = dotMatch[1];
                            const fullType = self.globalVars[varName];
                            
                            // Map 类型特殊处理：提供 Key 提示
                            if (fullType && fullType.startsWith('java.util.Map<')) {
                                const keys = self.mapKeysCache[varName] || [];
                                const keySuggestions = keys.map(k => ({
                                    label: k,
                                    kind: monaco.languages.CompletionItemKind.EnumMember,
                                    detail: `Key of ${varName}`,
                                    insertText: k,
                                    sortText: '000_' + k,
                                    range: new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn)
                                }));
                                const mapMethods = await self.getMethodSuggestions('java.util.Map', monaco, model, position);
                                mapMethods.suggestions.forEach(s => s.sortText = '100_' + s.label);
                                return { suggestions: [...keySuggestions, ...mapMethods.suggestions] };
                            }

                            // 常规类方法推断 (包含 String, int 等)
                            const className = self.inferClassName(model, varName);
                            if (className) {
                                const res = await self.getMethodSuggestions(className, monaco, model, position);
                                res.suggestions.forEach(s => s.sortText = '100_' + s.label);
                                return res;
                            }
                        }

                        // --- 3. 全局公共提示 (变量名、包名、类名) ---
                        let allSuggestions = [];
                        if (!prefix.includes('.') || prefix.match(/^\s*[a-zA-Z0-9_]*$/)) {
                            const globalSugs = self.getGlobalVarSuggestions(monaco, word, position);
                            globalSugs.suggestions.forEach(s => s.sortText = '200_' + s.label);
                            allSuggestions = [...allSuggestions, ...globalSugs.suggestions];
                        }

                        const pathMatch = prefix.match(/([a-zA-Z0-9._]+)$/);
                        if (pathMatch) {
                            const currentInput = pathMatch[1];
                            const classPathSugs = await self.getClassPathSuggestions(monaco, currentInput, model, position, word);
                            allSuggestions = [...allSuggestions, ...classPathSugs.suggestions];
                        }

                        return { suggestions: allSuggestions };
                    }
                });
            },

            /**
             * 获取类路径和包名的补全建议
             */
            async getClassPathSuggestions(monaco, currentInput, model, position, word) {
                if (!this.allClasses.length) return { suggestions: [] };
                const lastDotIndex = currentInput.lastIndexOf('.');
                const isPathMode = lastDotIndex > -1;
                const parentPath = isPathMode ? currentInput.substring(0, lastDotIndex + 1) : "";
                const nextLevelItems = new Set();
                const suggestions = [];

                this.allClasses.forEach(fullPath => {
                    let segment = "";
                    let isClass = false;
                    if (isPathMode) {
                        if (fullPath.startsWith(currentInput)) {
                            const suffix = fullPath.substring(parentPath.length);
                            const parts = suffix.split('.');
                            segment = parts[0];
                            isClass = parts.length === 1;
                        }
                    } else {
                        const className = fullPath.substring(fullPath.lastIndexOf('.') + 1);
                        if (className.toLowerCase().startsWith(currentInput.toLowerCase())) {
                            segment = className;
                            isClass = true;
                        }
                    }

                    if (segment && !nextLevelItems.has(segment + (isClass ? '_cls' : '_pkg'))) {
                        nextLevelItems.add(segment + (isClass ? '_cls' : '_pkg'));
                        suggestions.push({
                            label: segment,
                            kind: isClass ? monaco.languages.CompletionItemKind.Class : monaco.languages.CompletionItemKind.Folder,
                            detail: isClass ? fullPath : `package ${parentPath + segment}`,
                            insertText: segment,
                            range: new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn),
                            sortText: (isClass ? '200_' : '110_') + segment,
                            additionalTextEdits: (isClass && !model.getLineContent(position.lineNumber).trim().startsWith('import')) 
                                                 ? this.generateImportEdits(model, fullPath) : []
                        });
                    }
                });
                return { suggestions };
            },

            /**
             * 变量类型推断逻辑
             * 支持字面量识别、显式声明推断及 Map 深度推断
             */
            inferClassName(model, varName, subPath = null) {
                let fullType = this.globalVars[varName];

                // 处理 Map 泛型推断 (例如 db.master -> 获取泛型 V)
                if (fullType && subPath) {
                    const genericMatch = fullType.match(/java\.util\.Map<[^,]+,\s*([^>]+)>/);
                    if (genericMatch) return genericMatch[1].trim(); 
                }
                if (fullType) return fullType;
                
                const lines = model.getLinesContent();
                // 正则匹配变量赋值行
                const assignmentRegex = new RegExp(`(?:^|\\s+)([a-zA-Z0-9_<>\\[\\]]+)?\\s*${varName}\\s*=([^;\\n]*)`);
                
                for (let i = lines.length - 1; i >= 0; i--) {
                    const line = lines[i].trim();
                    let match = line.match(assignmentRegex);
                    
                    if (match) {
                        let explicitType = match[1] ? match[1].trim() : null;
                        let value = match[2].trim();
                        
                        // A. 基础显式类型声明映射（含 Groovy/Java 常用类型）
                        if (explicitType) {
                            const typeMap = {
                                'int': 'java.lang.Integer',
                                'long': 'java.lang.Long',
                                'double': 'java.lang.Double',
                                'float': 'java.lang.Float',
                                'short': 'java.lang.Short',
                                'byte': 'java.lang.Byte',
                                'boolean': 'java.lang.Boolean',
                                'string': 'java.lang.String',
                                'String': 'java.lang.String'
                            };
                            if (typeMap[explicitType]) return typeMap[explicitType];
                            // 复杂对象处理：从 import 查找全路径
                            if (/^[A-Z]/.test(explicitType) && !['var','def'].includes(explicitType)) {
                                return this.findFullClassFromImport(lines, explicitType);
                            }
                        }

                        // B. 基于右侧赋值字面量推断类型
                        if (/^["']/.test(value)) return 'java.lang.String';
                        if (/^-?\d+L$/i.test(value)) return 'java.lang.Long';
                        if (/^-?\d+\.\d+/.test(value)) return 'java.lang.Double';
                        if (/^-?\d+$/.test(value)) return 'java.lang.Integer';
                        if (value.startsWith('[:') || (value.startsWith('[') && value.includes(':'))) return 'java.util.Map';
                        if (value.startsWith('[') && !value.includes(':')) return 'java.util.List';
                        
                        let matchNew = value.match(/^new\s+([a-zA-Z0-9_]+)/);
                        if (matchNew) return this.findFullClassFromImport(lines, matchNew[1]);
                    }
                }
                // 处理静态类调用 (首字母大写视为类)
                if (/^[A-Z]/.test(varName)) return this.findFullClassFromImport(lines, varName);
                return null;
            },

            /**
             * 根据简单类名查找全路径类名
             */
            findFullClassFromImport(lines, simpleName) {
                for (let line of lines) {
                    if (line.trim().startsWith('import ') && line.trim().endsWith(simpleName)) {
                        return line.trim().replace('import ', '').replace(';', '').trim();
                    }
                }
                // 常用基础类兜底
                const common = { 'String': 'java.lang.String', 'Date': 'java.util.Date' };
                if (common[simpleName]) return common[simpleName];
                return this.allClasses.find(f => f.endsWith('.' + simpleName)) || simpleName;
            },

            /**
             * 调用后端接口获取类的详细方法元数据并转化为建议项
             */
           async getMethodSuggestions(className, monaco, model, position) {
                if (!this.classCache[className]) {
                    try {
                        const params = new URLSearchParams();
                        params.append('className', className);
                        const res = await fetch(`/tiga/meta/class`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: params
                        }).then(r => r.json());
                        if (res.code === 200) this.classCache[className] = res.data;
                    } catch (e) { return { suggestions: [] }; }
                }

                const meta = this.classCache[className];
                if (!meta || !meta.methods) return { suggestions: [] };
                
                const word = model.getWordUntilPosition(position);
                return {
                    suggestions: meta.methods.map(m => {
                        // 构建方法插入片段
                        let snippet = m.name + "(";
                        if (m.parameters && m.parameters.length > 0) {
                            snippet += m.parameters.map((p, index) => `\${${index + 1}:${p}}`).join(", ");
                        }
                        snippet += ")";

                        // 构建文档 Markdown 描述
                        let docValue = "";
                        if (m.annotations?.length > 0) {
                            docValue += m.annotations.map(a => `\`${a}\``).join(' ') + "\n\n---\n";
                        }
                        let cleanComment = (m.comment || '暂无说明').replace(/\\n/g, '\n');
                        docValue += `### ${m.name}\n${cleanComment}\n\n**Return:** \`${m.returnType}\``;

                        return {
                            label: m.name,
                            kind: monaco.languages.CompletionItemKind.Method,
                            detail: `${m.returnType} (${m.parameters.join(', ')})`,
                            documentation: { value: docValue, isTrusted: true, supportHtml: true },
                            insertText: snippet,
                            insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                            range: new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn),
                            command: { id: 'editor.action.triggerParameterHints', title: '参数提示' }
                        };
                    })
                };
            },

            /**
             * 生成自动导入语句的编辑操作
             */
            generateImportEdits(model, fullPath) {
                const content = model.getValue();
                if (content.includes(`import ${fullPath}`)) return [];
                return [{ range: new monaco.Range(1, 1, 1, 1), text: `import ${fullPath}\n` }];
            },

            /**
             * 获取预定义的全局变量提示
             */
            getGlobalVarSuggestions(monaco, word, position) {
                return {
                    suggestions: Object.keys(this.globalVars).map(varName => ({
                        label: varName,
                        kind: monaco.languages.CompletionItemKind.Variable,
                        detail: `内置变量 (${this.globalVars[varName]})`,
                        insertText: varName,
                        sortText: '000_' + varName,
                        range: new monaco.Range(position.lineNumber, word.startColumn, position.lineNumber, word.endColumn)
                    }))
                };
            },

            /**
             * 注册悬停提示服务
             */
            registerHover(monaco) {
                const self = this;
                monaco.languages.registerHoverProvider(Debugger.language, {
                    provideHover: async (model, position) => {
                        const word = model.getWordAtPosition(position);
                        if (!word) return null;
                        const line = model.getLineContent(position.lineNumber);
                        const prefix = line.substring(0, word.startColumn - 1);
                        const multiDotMatch = prefix.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_.]+)\.$/);
                        const singleDotMatch = prefix.match(/([a-zA-Z0-9_]+)\.$/);
                        let className = null;
                        let isMethodHover = false;

                        // 推断悬停单词所属的类
                        if (multiDotMatch) {
                            className = self.inferClassName(model, multiDotMatch[1], multiDotMatch[2]);
                            isMethodHover = true;
                        } else if (singleDotMatch) {
                            const rootVar = singleDotMatch[1];
                            const fullType = self.globalVars[rootVar];
                            if (fullType && fullType.startsWith('java.util.Map<')) {
                                className = self.inferClassName(model, rootVar, word.word);
                                isMethodHover = false;
                            } else {
                                className = self.inferClassName(model, rootVar);
                                isMethodHover = true;
                            }
                        } else {
                            className = self.inferClassName(model, word.word);
                            isMethodHover = false;
                        }

                        if (!className) return null;
                        if (!self.classCache[className]) await self.getMethodSuggestions(className, monaco, model, position);
                        const meta = self.classCache[className];
                        if (!meta) return null;

                        // 显示方法文档或类文档
                        if (isMethodHover) {
                            const method = meta.methods.find(m => m.name === word.word);
                            if (method) {
                                let contents = [];
                                if (method.annotations?.length > 0) contents.push({ value: "```java\n" + method.annotations.join('\n') + "\n```" });
                                contents.push({ value: `### 方法: ${method.name}` });
                                contents.push({ value: (method.comment || '').replace(/\\n/g, '\n') });
                                contents.push({ value: `**返回类型:** \`${method.returnType}\`  \n**参数:** \`(${method.parameters.join(', ')})\`` });
                                return { contents: contents };
                            }
                        } 
                        let contents = [];
                        if (meta.annotations?.length > 0) contents.push({ value: "```java\n" + meta.annotations.join('\n') + "\n```" });
                        contents.push({ value: `### 类: ${meta.className}` });
                        contents.push({ value: (meta.doc || '暂无类说明').replace(/\\n/g, '\n') });
                        return { contents: contents };
                    }
                });
            },

            /**
             * 注册函数签名帮助（参数提示）
             */
            registerSignatureHelp(monaco) {
                const self = this;
                monaco.languages.registerSignatureHelpProvider(Debugger.language, {
                    signatureHelpTriggerCharacters: ['(', ','],
                    provideSignatureHelp: async (model, position) => {
                        const line = model.getLineContent(position.lineNumber);
                        const prefix = line.substring(0, position.column);
                        const multiMatch = prefix.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]+)\s*\($/);
                        const singleMatch = prefix.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]+)\s*\($/);
                        let className = null, methodName = null;

                        // 解析当前所在的函数调用上下文
                        if (multiMatch) {
                            methodName = multiMatch[3];
                            className = self.inferClassName(model, multiMatch[1], multiMatch[2]);
                        } else if (singleMatch) {
                            methodName = singleMatch[2];
                            className = self.inferClassName(model, singleMatch[1]);
                        }

                        if (className) {
                            if (!self.classCache[className]) await self.getMethodSuggestions(className, monaco, model, position);
                            const meta = self.classCache[className];
                            if (meta && meta.methods) {
                                const methods = meta.methods.filter(m => m.name === methodName);
                                if (methods.length === 0) return null;
                                return {
                                    value: {
                                        signatures: methods.map(m => ({
                                            label: `${m.name}(${m.parameters.join(', ')})`,
                                            parameters: m.parameters.map(p => ({ label: p })),
                                            documentation: { value: (m.comment || '').replace(/\\n/g, '\n'), isTrusted: true }
                                        })),
                                        activeSignature: 0, activeParameter: 0
                                    },
                                    dispose: () => {}
                                };
                            }
                        }
                        return null;
                    }
                });
            },
            async Request (url, method, data){
        	    try {
        	        const params = new URLSearchParams();
        	        for (let name in data) { params.append(name, data[name]); }
        	        let options = { method: method, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } };
        	        if (method.toUpperCase() === 'GET') {
        	            const queryString = params.toString();
        	            if (queryString) { url = `${url}${url.includes('?') ? '&' : '?'}${queryString}`; }
        	        } else { options.body = params; }
        	        const res =  await fetch(url, options).then(r => r.json());
        	        if(res.code == 200) return res.data;
        	        return null;
        	    } catch (e) { console.error("请求失败:", e); return null; }
        	},
           async getModuleKeys() {
                var data = await this.Request('/tiga/plugin/resource/model', 'get', {modelNames:'db'});
                if(data){
    				this.mapKeysCache['db'] = data['db'];
    			}
           }
        };

        Debugger.init();
    </script>
