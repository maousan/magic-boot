<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Java在线编辑器</title>
    <style>
        #container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #editor {
            width: 100%;
            height: 80vh;
            border: 1px solid #ccc;
        }
        #controls {
            padding: 10px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .magic-monaco-editor{
			flex: 1;
			overflow: hidden;
		}
		.magic-monaco-editor :deep(.breakpoints){
		    background: var(--breakpoints-background-color);
		    width: 10px !important;
		    height: 10px !important;
		    right: 0px !important;
		    margin-left: 12px;
		    top: 5px;
		    border-radius: 5px;
		}
		.magic-monaco-editor :deep(.debug-line) {
		    background: var(--debug-line-background-color);
		    color: #fff !important;
		}
		.magic-monaco-editor :deep(.breakpoint-line) {
		    background: var(--breakpoint-line-background-color);
		}
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <button onclick="changeTheme()">切换主题</button>
            <button onclick="formatCode()">格式化代码</button>
            <button onclick="getCode()">获取代码</button>
            <button onclick="foldAll()">折叠所有</button>
            <button onclick="unfoldAll()">展开所有</button>
        </div>
        <div id="editor" class="magic-monaco-editor"></div>
    </div>

    <!-- 引入Monaco Editor -->
    <script src="loader.min.js"></script>
    <script>
 
        // 配置Monaco Editor的路径
        require.config({ 
            paths: { 
                'vs': 'vs',
                'editor': '.'
            },
            'vs/nls': {
                availableLanguages: {
                  '*': 'zh-cn' // 核心配置：设置语言为中文
                }
              }
        });

        let editor;
        let doValidate;
        // 初始化编辑器
        require([
        	'scripts/constants.js',
        	'scripts/editor/default-theme.js',
        	'scripts/editor/dark-new-theme.js',
        	'scripts/editor/mybatis.js',
        	'scripts/beautifier/javascript/beautifier.js',
        	'vs/editor/editor.main',
        	], function(constants, defaultTheme,darkNewTheme, mybatis,Beautifier) {
        	
        	constants.HEADER_MAGIC_TOKEN_VALUE = localStorage.getItem('token')
        	
        	mybatis()
        	monaco.editor.defineTheme('defaultTheme', defaultTheme.editor)
        	monaco.editor.defineTheme('darkNewTheme', darkNewTheme.editor)
        	
        	// 初始化编辑器配置
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: ``,
                folding: true,
                language: 'magicscript',  // 设置为Java语言
                theme: 'darkNewTheme',  // 深色主题
                automaticLayout: true,  // 自动调整布局
                minimap: {
                    enabled: false  // 关闭小地图
                },
                scrollBeyondLastLine: false,
                fontFamily: 'JetBrainsMono, Consolas, "Courier New",monospace, 微软雅黑',
                fontSize: 16,
    			fontLigatures: true,
                wordWrap: 'on',
                lineNumbers: 'on',
                lineDecorationsWidth: 35,
                renderWhitespace: 'none',
                roundedSelection: false,
                scrollbar: {
                    vertical: 'visible',
                    horizontal: 'visible',
                    useShadows: false
                }
            });
        	
            const language = 'magicscript';
         	// 注册语言
            monaco.languages.register({ id: language });
         	
         	// 设置语言选项
            monaco.languages.setLanguageConfiguration(language, {
                wordPattern: /(-?\d*\.\d\w*)|([^`~!#%^&*()\-=+[{\]}\\|;:'",.<>/?\s]+)/g,
                brackets: [
                    ['{', '}'],
                    ['[', ']'],
                    ['(', ')'],
                ],
                onEnterRules: [
                    {
                        // e.g. /** | */
                        beforeText: /^\s*\/\*\*(?!\/)([^\*]|\*(?!\/))*$/,
                        afterText: /^\s*\*\/$/,
                        action: {
                            indentAction: monaco.languages.IndentAction.IndentOutdent,
                            appendText: ' * '
                        }
                    },
                    {
                        // e.g. /** ...|
                        beforeText: /^\s*\/\*\*(?!\/)([^\*]|\*(?!\/))*$/,
                        action: {
                            indentAction: monaco.languages.IndentAction.None,
                            appendText: ' * '
                        }
                    },
                    {
                        // e.g.  * ...|
                        beforeText: /^(\t|(\ \ ))*\ \*(\ ([^\*]|\*(?!\/))*)?$/,
                        action: {
                            indentAction: monaco.languages.IndentAction.None,
                            appendText: '* '
                        }
                    },
                    {
                        // e.g.  */|
                        beforeText: /^(\t|(\ \ ))*\ \*\/\s*$/,
                        action: {
                            indentAction: monaco.languages.IndentAction.None,
                            removeText: 1
                        }
                    }
                ],
                comments: {
                    lineComment: '//',
                    blockComment: ['/*', '*/'],
                },
                operators: ['<=', '>=', '==', '!=', '+', '-', '*', '/', '%', '&', '|', '!', '&&', '||', '?', ':', '++', '--', '+=', '-=', '*=', '/='],
                autoClosingPairs: [
                    { open: '{', close: '}' },
                    { open: '[', close: ']' },
                    { open: '(', close: ')' },
                    { open: '"""', close: '"""', notIn: ['string.multi'] },
                    { open: '<where>', close: '</where>' },
                    { open: '<if', close: ' test=""></if>' },
                    { open: '<elseif', close: ' test=""></elseif>' },
                    { open: '<else', close: '></else>' },
                    { open: '<set>', close: '</set>' },
                    { open: '<trim>', close: '</trim>' },
                    { open: '<foreach', close: ' collection=""></foreach>' },
                    { open: '"', close: '"', notIn: ['string'] },
                    { open: '\'', close: '\'', notIn: ['string'] },
                    { open: '/**', close: ' */', notIn: ['string'] }
                ],
            })

            require([
            	'scripts/editor/java-class.js', 
            	'scripts/editor/completion',
            	'scripts/editor/high-light.js',
            	'scripts/editor/folding.js',
            	'scripts/editor/signature.js',
            	'scripts/editor/hover.js',
            	'scripts/parsing/parser.js',
            	'scripts/parsing/index.js',
            	'scripts/parsing/tokenizer.js'
            	], function(JavaClass,
            			CompletionItemProvider,
            			HighLightOptions,
            			FoldingRangeProvider,
            			SignatureHelpProvider,
            			HoverProvider, parserObj, indexObj, tokenizer) {
            	
            	const {Parser} = parserObj
            	const {TokenStream} = indexObj
            	// 设置高亮
        		monaco.languages.setMonarchTokensProvider(language, HighLightOptions);
            	
                // 设置代码提示
        		monaco.languages.registerCompletionItemProvider(language, CompletionItemProvider);
        		// 设置折叠
        	    monaco.languages.registerFoldingRangeProvider(language, FoldingRangeProvider);
        	    // 设置参数提示
        	    monaco.languages.registerSignatureHelpProvider(language, SignatureHelpProvider);
        	 	// 设置悬浮提示
        	    monaco.languages.registerHoverProvider(language, HoverProvider);
        	 	
        	    JavaClass.initClasses();
         	    JavaClass.initImportClass();
         	    JavaClass.loadAllResources();
        	    
        		editor.addAction({
				  // 设置一个唯一的ID
				  id: 'editor.action.triggerSuggest.extension',
				  // 在编辑器右键菜单中显示的标签
				  label: '触发代码提示',
				  // 设置多个快捷键：Ctrl/Cmd + Enter 以及 Alt + Enter
			      keybindings: [
			        monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
			        monaco.KeyMod.Alt | monaco.KeyCode.Enter
			      ],
				  // 定义快捷键触发后执行的函数
				  run: function() {
				    // 通过触发编辑器的"触发建议"命令来唤起代码提示
				    editor.trigger(null, 'editor.action.triggerSuggest');
				  }
				});
        	    
        	    
                doValidate = () =>{
        			if(editor){
        				// 清空之前的验证标记
        				monaco.editor.setModelMarkers(editor.getModel(), 'validate', [{}])
        			}
       				try{
       					new Parser(new TokenStream(tokenizer(editor.getValue()))).parse()
       				} catch(e){
       					//console.log(e.message)
       					if(e.span){
       						let line = e.span.getLine()
       						
       						monaco.editor.setModelMarkers(editor.getModel(), 'validate', [
       							{
       							startLineNumber: line.lineNumber,
       							endLineNumber: line.endLineNumber,
       							startColumn: line.startCol,
       							endColumn: line.endCol,
       							message: e.message,
       							severity: monaco.MarkerSeverity.Error
       							}
       						])
       					}
       				}
        		}
            }, function(error) {
                console.error('加载模块失败:', error);
            });
         	
         	// 设置代码格式化
            monaco.languages.registerDocumentFormattingEditProvider(language, {
                provideDocumentFormattingEdits(model, options, token) {
                    return [{
                        text: new Beautifier(model.getValue()).beautify(),
                        range: model.getFullModelRange()
                    }]
                }
            })
            
            // 设置html闭合标签提示
		    monaco.languages.registerCompletionItemProvider('html', {
		        triggerCharacters: ['>'],
		        provideCompletionItems: (model, position) => {
		            const codePre = model.getValueInRange({
		                startLineNumber: position.lineNumber,
		                startColumn: 1,
		                endLineNumber: position.lineNumber,
		                endColumn: position.column,
		            })
		            const tag = codePre.match(/.*<(\w+)>$/)?.[1];
		            if (!tag) {
		                return;
		            }
		            const word = model.getWordUntilPosition(position);
		            return {
		                suggestions: [{
		                    label: `</${tag}>`,
		                    kind: monaco.languages.CompletionItemKind.EnumMember,
		                    insertText: `$1</${tag}>`,
		                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
		                    range:  {
		                        startLineNumber: position.lineNumber,
		                        endLineNumber: position.lineNumber,
		                        startColumn: word.startColumn,
		                        endColumn: word.endColumn,
		                    }
		                }]
		            }
		        }
		    })
		    
		    // 在 Monaco Editor 初始化代码中添加
            monaco.editor.registerCommand('editor.action.appendHead', (_c, text) => {
    			if(editor.getValue()?.indexOf(text) > -1){
    				return
    			}
    			editor.executeEdits('', [{
    				forceMoveMarkers: true,
    				text:text,
    				range: new monaco.Range(1, 0, 1, 0)
    			}])
    			editor.setScrollTop(editor.getScrollTop() - 22)
    		})
            
            // 监听编辑器内容变化
            editor.onDidChangeModelContent(function(event) {
            	doValidate()
               // console.log('内容发生变化:', event);
                // 这里可以添加实时保存等逻辑
            });

            // 监听编辑器失去焦点事件
            editor.onDidBlurEditorWidget(function() {
                //console.log('编辑器失去焦点');
            });

            // 监听滚动事件
            editor.onDidScrollChange(function(scrollInfo) {
                // 可以在这里实现滚动同步等功能
            });
        });

        // 切换主题
        function changeTheme(name) {
            //const currentTheme = editor.getOption(monaco.editor.EditorOption.theme);
            monaco.editor.setTheme(name);
        }

        // 格式化代码
        function formatCode() {
            editor.getAction('editor.action.formatDocument').run().then(() => {
                console.log('代码已格式化');
            }).catch(err => {
                console.log('格式化失败:', err);
            });
        }

        // 获取编辑器中的代码
        function getCode() {
            const code = editor.getValue();
            return code;
        }

        // 折叠所有代码块
        function foldAll() {
            editor.getAction('editor.foldAll').run();
        }

        // 展开所有代码块
        function unfoldAll() {
            editor.getAction('editor.unfoldAll').run();
        }

        // 设置代码
        function setCode(newCode) {
            editor.setValue(newCode);
        }

        // 窗口大小变化时调整编辑器布局
        window.addEventListener('resize', function() {
            if (editor) {
                editor.layout();
            }
        });
        
        
    </script>
</body>
</html>
