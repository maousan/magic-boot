<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>TigaAPI 低代码在线调试器</title>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <style>
        .highlight-line { background: rgba(255, 255, 0, 0.3) !important; border-left: 5px solid gold; }
        .glyph-breakpoint { background: red; border-radius: 50%; width: 12px !important; height: 12px !important; margin-left: 5px; }
        #app { display: flex; height: 95vh; gap: 10px; padding: 10px; background: #2d2d2d; color: white; }
        #editor { flex: 3; border-radius: 4px; overflow: hidden; }
        #panel { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; padding: 10px; border-radius: 4px; }
        .var-row { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid #333; font-family: monospace; }
        .btns { margin-bottom: 10px; }
        button { padding: 8px 15px; cursor: pointer; border: none; border-radius: 3px; background: #444; color: white; margin-right: 5px; }
        button:hover { background: #666; }
        #status { color: #00ff00; font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="app">
    <div id="editor"></div>
    <div id="panel">
        <div id="status">● 就绪</div>
        <div class="btns">
            <button onclick="startDebug()" style="background: #28a745;">▶ 启动调试</button>
            <button onclick="sendCmd('step')" style="background: #007bff;">⤵ 下一步</button>
            <button onclick="sendCmd('resume')" style="background: #17a2b8;">➡ 继续</button>
        </div>
        <h4 style="border-bottom: 1px solid #555; padding-bottom: 5px;">内存变量快照</h4>
        <div id="var-list" style="overflow-y: auto;"></div>
    </div>
</div>

<script>
    let editor, executionId, decorationIds = [], breakpoints = [], ws;
    
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('editor'), {
            value: "def x = 100\ndef y = 200\ndef total = x + y\nprintln '结果: ' + total",
            language: 'groovy',
            theme: 'vs-dark',
            glyphMargin: true
        });

        // 绑定断点点击
        editor.onMouseDown(e => {
            if (e.target.type === 2) { // GlyphMargin
                let line = e.target.position.lineNumber;
                let idx = breakpoints.indexOf(line);
                if (idx > -1) breakpoints.splice(idx, 1); else breakpoints.push(line);
                updateBpUI();
                syncBreakpoints();
            }
        });
    });

    function updateBpUI() {
        let decs = breakpoints.map(l => ({
            range: new monaco.Range(l, 1, l, 1),
            options: { glyphMarginClassName: 'glyph-breakpoint' }
        }));
        editor.deltaDecorations([], decs);
    }

    async function startDebug() {
        executionId = "TIGA_" + Math.random().toString(36).substr(2, 9);
        document.getElementById('status').innerText = "○ 正在连接 WebSocket...";
        
        // 使用改造后的 sid 模式
        ws = new WebSocket(`ws://${location.host}/debug-ws?sid=${executionId}`);
        
        ws.onopen = () => {
            document.getElementById('status').innerText = "● 调试中: " + executionId;
            fetch('/api/script/debug/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    scriptId: 'test_001',
                    scriptText: editor.getValue(),
                    executionId: executionId
                })
            });
            syncBreakpoints();
        };

        ws.onmessage = (e) => {
            const res = JSON.parse(e.data);
            if (res.type === 'BREAKPOINT_HIT') {
                renderVars(res.data.variables);
                highlight(res.data.line);
            } else if (res.type === 'ERROR') {
                alert("后端错误: " + res.data);
            }
        };
    }

    function renderVars(vars) {
        const container = document.getElementById('var-list');
        let html = '';
        for (let key in vars) {
            if(key === '_debug_context_') continue;
            html = `<div class="var-row"><span style="color:#9cdcfe">${key}</span><span style="color:#ce9178">${vars[key]}</span></div>` + html;
        }
        container.innerHTML = html;
    }

    function highlight(line) {
        decorationIds = editor.deltaDecorations(decorationIds, [{
            range: new monaco.Range(line, 1, line, 1),
            options: { isWholeLine: true, className: 'highlight-line' }
        }]);
        editor.revealLineInCenter(line);
    }

    function sendCmd(action) {
        fetch(`/api/script/debug/cmd?executionId=${executionId}&action=${action}`, {method: 'POST'});
    }

    function syncBreakpoints() {
        if(executionId) fetch(`/api/script/debug/cmd?executionId=${executionId}&action=setBp`, {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(breakpoints)
        });
    }
</script>
</body>
</html>
