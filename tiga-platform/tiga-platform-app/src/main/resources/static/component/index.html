<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>低代码组件库管理</title>

<link rel="stylesheet" href="./js/element-plus/index.css" />
<link rel="stylesheet" href="./css/component.css" />
<style>
   .designer-wrapper {
    width: 100%;
    height: calc(100vh - 120px);
    background: #f0f2f5;
}
</style>
</head>
<body>

<div id="app">
    <div class="header-bar">
        <div class="action-group">
            <el-radio-group v-model="queryParams.ctype" @change="handleTabChange">
                <el-radio-button label="1">表单组件</el-radio-button> 
                <el-radio-button label="2">业务组件</el-radio-button> 
            </el-radio-group>{
            <el-button-group>
                <el-button icon="Plus" @click="openCreateDialog(false)">创建组件</el-button>
                <el-button icon="FolderAdd" @click="openCreateDialog(true)">新建文件夹</el-button>
            </el-button-group>}
        </div>
         <div style="width: 300px;">
            <el-input v-model="queryParams.keyword" placeholder="搜索组件名称..." clearable @clear="fetchData" @keyup.enter="fetchData">
                <template #append>
                    <el-button @click="fetchData">
                        <el-icon><Search /></el-icon>
                    </el-button>
                </template>
            </el-input>
        </div>
    </div>

    <div class="nav-bar">
        <el-breadcrumb separator="/"> 
            <el-breadcrumb-item>
                <a @click="goToRoot" style="cursor: pointer; font-weight: bold;">根目录</a>
            </el-breadcrumb-item>
            <el-breadcrumb-item v-for="(crumb, index) in breadcrumbs" :key="crumb.id"> 
                <a @click="goToBreadcrumb(index)" style="cursor: pointer;">{{crumb.name }}</a> 
            </el-breadcrumb-item> 
        </el-breadcrumb>
    </div>

    <div class="main-container" :style="{ padding: designComponent ? '0px' : '20px' }" v-loading="loading">
    	<div v-if="!designComponent">
	        <div v-if="listData.length > 0" class="grid-wrapper">
	            <div v-for="item in listData" :key="item.id" class="grid-item" 
	                :class="item.is_folder ? 'is-folder' : 'is-component'"
	                @click="handleItemClick(item)">
	                <div class="item-thumb">
	                    <el-icon v-if="item.is_folder"><Folder /></el-icon>
	                    <el-icon v-else><component-icon /></el-icon>
	                </div>
	
	                <div class="item-info" @click.stop @dblclick.stop="startRename(item)">
	                    <div v-if="editingId === item.id" style="width: 100%;">
	                        <el-input v-model="tempName" size="small" class="rename-input"
	                            ref="nameInput" @blur="confirmRename(item)"
	                            @keyup.enter="confirmRename(item)" />
	                    </div>
	                    <span v-else class="item-name" :title="item.name">{{item.name }}</span>
	                </div>
	
	                <div v-if="!item.is_folder" class="hover-actions" @click.stop>
	                    <el-button type="primary" size="small" round @click="openDesigner(item)">设计</el-button>
	                    <el-button type="danger" size="small" round icon="Delete" circle @click="deleteItem(item)"></el-button>
	                </div>
	            </div>
	        </div>
	        <div v-else class="empty-state">
	            <el-empty description="当前目录下暂无内容"></el-empty>
	        </div>
        </div>
		<div v-if="designComponent" class="designer-wrapper">
		    <iframe 
		        ref="iframeRef" 
		        :src="iframeUrl" 
		        frameborder="0" 
		        style="width: 100%; height: calc(100vh - 105px);"
		        @load="onIframeLoad(currentItem)"
		    ></iframe>
		</div>
    </div>

    <el-dialog v-model="dialogVisible" :title="isFolderMode ? '新建文件夹' : '创建新组件'" width="400px">
        <el-form :model="createForm" label-width="80px" @submit.prevent>
            <el-form-item label="名称" required>
                <el-input v-model="createForm.name" placeholder="请输入名称" @keyup.enter="handleCreate" />
            </el-form-item>
            <el-form-item label="类型">
                <el-tag>{{ queryParams.ctype === '1' ? '表单组件' : '业务组件' }}</el-tag>
            </el-form-item>
            <el-form-item label="位置">
                <el-tag type="info">{{ currentPathName }}</el-tag>
            </el-form-item>
        </el-form>
        <template #footer>
            <el-button @click="dialogVisible = false">取消</el-button>
            <el-button type="primary" :loading="createLoading" @click="handleCreate">确定</el-button>
        </template>
    </el-dialog>
</div>

<script src="./js/axios.min.js"></script>
<script src="./js/vue3/vue.global.prod.js"></script>
<script src="./js/element-plus/index.full.min.js"></script>
<script src="./js/vue3/index.iife.min.js"></script>

<script>
const { createApp, ref, reactive, onMounted, nextTick, computed } = Vue;

const app = createApp({
    setup() {
        const loading = ref(false);
        const listData = ref([]);
        const breadcrumbs = ref([]);
        const queryParams = reactive({ pid: '0', ctype: '1', keyword: '' });
        const apiBase = 'tiga/component';
        const designComponent = ref(false)
        const iframeRef = ref(null); // 用来绑定 DOM
		const currentItem = ref(null); // 用来暂存当前点击的 item

        const editingId = ref(null);
        const tempName = ref('');

        // 创建相关状态 ---
        const dialogVisible = ref(false);
        const createLoading = ref(false);
        const isFolderMode = ref(false);
        const createForm = reactive({ name: '' });
        
        const iframe = ref(null);
        const iframeUrl = ref()
        
        const currentPathName = computed(() => {
            if (breadcrumbs.value.length === 0){return '根目录';}
            return breadcrumbs.value[breadcrumbs.value.length - 1].name;
        });

        const fetchData = async () => {
            loading.value = true;
            iframeUrl.value = "";
            try {
                const params = {
                    ctype: queryParams.ctype,
                    keyword: queryParams.keyword,
                    pid: queryParams.keyword ? '' : queryParams.pid 
                };
                const res = await axios.get(`${apiBase}/list`, { params });
                if (res.data.code === 200) {
                    listData.value = res.data.data;
                }
            } catch (error) {
            	ElementPlus.ElMessage.info('加载组件列表异常：'+error.messge); 
            } finally { loading.value = false; }
        };

        // --- 打开创建弹窗 ---
        const openCreateDialog = (asFolder) => {
            isFolderMode.value = asFolder;
            createForm.name = '';
            dialogVisible.value = true;
        };

        // --- 执行创建逻辑 ---
        const handleCreate = async () => {
            if (!createForm.name.trim()) {
                return ElementPlus.ElMessage.warning('请输入名称');
            }
            createLoading.value = true;
            try {
                const payload = {
                    name: createForm.name,
                    pid: queryParams.pid,
                    ctype: queryParams.ctype,
                    is_folder: isFolderMode.value? '1':'0'
                };
                const res = await axios.post(`${apiBase}/create`, payload);
                if (res.data.code === 200) {
                    ElementPlus.ElMessage.success('创建成功');
                    dialogVisible.value = false;
                    fetchData(); // 刷新列表
                } else {
                    ElementPlus.ElMessage.error(res.data.description || '创建失败');
                }
            } catch (e) {
                ElementPlus.ElMessage.error('网络请求失败');
            } finally {
                createLoading.value = false;
                designComponent.value = false;
            }
        };

        const startRename = (item) => {
            editingId.value = item.id;
            tempName.value = item.name;
            nextTick(() => {
                const input = document.querySelector('.rename-input input');
                if (input) input.focus();
            });
        };

        const confirmRename = async (item) => {
            if (!editingId.value) return;
            const newName = tempName.value.trim();
            if (!newName || newName === item.name) { editingId.value = null; return; }
            try {
                const res = await axios.post(`${apiBase}/rename`, { id: item.id, name: newName });
                if (res.data.code === 200) {
                    item.name = newName;
                    ElementPlus.ElMessage.success('名称已更新');
                }
            } catch (e) { item.name = newName; } finally { editingId.value = null; }
        };

        const handleTabChange = (ctype) => {
        	queryParams.pid = '0'; 
        	queryParams.keyword = ''; 
        	queryParams.ctype = ctype; 
        	breadcrumbs.value = []; 
        	designComponent.value = false;
        	fetchData();
        };

        const handleItemClick = (item) => {
            if (editingId.value) return;
            if (item.is_folder) {
                breadcrumbs.value.push({ id: item.id, name: item.name });
                queryParams.pid = item.id;
                queryParams.keyword = '';
                fetchData();
            } else { 
            	openDesigner(item); 
            }
        };

        const goToRoot = () => { 
        	breadcrumbs.value = []; 
        	queryParams.pid = '0'; 
        	designComponent.value = false; // 关闭设计器显示列表
        	fetchData(); 
        };
        
        const goToBreadcrumb = (index) => {
            const target = breadcrumbs.value[index];
            breadcrumbs.value = breadcrumbs.value.slice(0, index + 1);
            queryParams.pid = target.id;
            designComponent.value = false; // 关闭设计器显示列表
            fetchData();
        };

        const openDesigner = (item) => { 
           // ElementPlus.ElMessage.success(`进入设计页面：${item.name}`); 
            const baseOrigin = window.location.origin;
            
            currentItem.value = item; // 暂存数据，供 onload 使用

            if(queryParams.ctype == "1"){ 
                iframeUrl.value = baseOrigin + '/component-desgin.html?_t=' + Date.now();
            } else { 
                iframeUrl.value = baseOrigin + '/business-desgin.html?_t=' + Date.now();
            }
            
            designComponent.value = true;
            
            // 注意：使用 @load 方式后，这里不需要写 nextTick 和 getElementById 了
            // 数据传递将在 iframe 加载完毕后的 onIframeLoad 中自动处理
        };

        const onIframeLoad = () => {
            // 确保 DOM 引用存在
            if (iframeRef.value && iframeRef.value.contentWindow) {
                // 传递数据
                iframeRef.value.contentWindow.params = currentItem.value;
            }
        };
        
        const deleteItem = (item) => {
            ElementPlus.ElMessageBox.confirm(`确定要删除 ${item.name} 吗?`, '警告', { type: 'warning' })
            .then(async() => { 
            	 const payload = {
                    id: item.id
                };
                const res = await axios.post(`${apiBase}/delete`, payload);
                if (res.data.code === 200) {
                    ElementPlus.ElMessage.success('删除成功');
                    fetchData(); // 刷新列表
                } else {
                    ElementPlus.ElMessage.error(res.data.description || '删除失败');
                }
            });
        };

        onMounted(() => { fetchData(); });

        return {
            loading, listData, breadcrumbs, queryParams, editingId, tempName,
            dialogVisible, createLoading, isFolderMode, createForm, currentPathName,
            handleTabChange, handleItemClick, goToRoot, goToBreadcrumb, openDesigner, deleteItem, fetchData, startRename, confirmRename,
            openCreateDialog, handleCreate,
            designComponent,
            iframeUrl,
            iframeRef,
            onIframeLoad,
            currentItem
        };
    }
});

for (const [key, component] of Object.entries(ElementPlusIconsVue)) { app.component(key, component); }
app.component('component-icon', ElementPlusIconsVue.Document);
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
