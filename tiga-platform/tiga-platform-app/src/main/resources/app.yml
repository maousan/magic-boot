server:
  port: 8080

solon.app:
  name: tiga-platform

# 默认系统主库（存接口定义、数据源定义）
db_config:
  main:
    jdbcUrl: jdbc:mysql://192.168.2.90:3306/magic-boot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: magic
    password: Magic@2026
    driverClassName: com.mysql.cj.jdbc.Driver
    # 连接池详细配置 (HikariCP)
    type: com.zaxxer.hikari.HikariDataSource
    maximumPoolSize: 20
    minimumIdle: 5
    connectionTimeout: 30000
    idleTimeout: 600000
    maxLifetime: 1800000
    cachePrepStmts: true
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048
solon.logging.appender:
 console:
   enable: true
   level: INFO
   pattern: "%d{HH:mm:ss} %-5level %logger - %msg%n"
 file:
   enable: true
   level: INFO
   name: "logs/${solon.app.name}"
   maxFileSize: 10MB
   maxHistory: 7
 cloud:
   enable: false
   level: WARN
   
# 添加以下内容来关闭 Calcite 编译细节
solon.logging.logger:
  "org.apache.calcite.plan.RelOptPlanner":
    level: WARN
  "org.apache.calcite.plan.volcano.VolcanoPlanner":
    level: WARN
  "org.apache.calcite.prepare.CalcitePrepareImpl":
    level: WARN
  "org.apache.calcite.sql.validate.SqlValidatorImpl":
    level: WARN