feature: 2026-05-21-dxhp-admin-panel
created: 2026-05-21

steps:
  - action: "项目骨架：初始化 Vite + Vue3 + Naive UI 项目，配置路由、布局、认证"
    exit_signal: "npm run dev 启动后能看到登录页，登录后跳转到带侧边栏的空 Dashboard"
    status: done

  - action: "API 层 + 类型定义：封装 axios 实例、拦截器、所有 API 模块和 TypeScript 类型"
    exit_signal: "类型定义完整，API 函数可调用，dev proxy 联通后端且错误能弹出提示"
    status: done

  - action: "LED 设备管理页面：设备列表表格 + LED 控制面板"
    exit_signal: "进入页面能看到设备列表，选择设备执行开/关灯并看到结果"
    status: done

  - action: "库位-LED 绑定管理页面：分页表格 + 创建/删除绑定"
    exit_signal: "表格展示绑定数据，创建和删除操作成功后表格自动刷新"
    status: done

  - action: "库位-标签绑定管理页面：分页表格 + 创建/解绑"
    exit_signal: "表格展示标签绑定数据，创建绑定和解绑操作成功后表格自动刷新"
    status: done

  - action: "库位导入页面：模板下载 + Excel 上传 + 结果展示"
    exit_signal: "能下载模板，上传合规文件后显示总数/成功/失败/错误明细"
    status: done

  - action: "批次 EPC 管理页面：分页搜索表格 + 绑定/解绑"
    exit_signal: "表格展示 EPC 绑定数据，搜索/绑定/解绑操作正常"
    status: done

  - action: "后端补齐：新增 LED 映射列表 API 和标签映射列表 API 的 .ms 文件"
    exit_signal: "前端 LED 绑定和标签绑定表格能分页展示数据"
    status: done

  - action: "构建配置：配置 Vite 构建输出到 plugin static/admin/ 目录"
    exit_signal: "npm run build 产物出现在 target 目录，Spring Boot 能正常服务"
    status: done

