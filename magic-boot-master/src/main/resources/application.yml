server:
  port: 8089
  compression:
    enabled: true
    min-response-size: 128

# 扩展配置
extend:
  redis:
    enabled: true  # Redis开关，false则不加载Redis

# 插件配置plugin:  path: plugins  # 插件根目录
management:
  health:
    redis:
      enabled: ${extend.redis.enabled}  # 禁用 Redis 健康检查

spring:
  profiles:
    active: dev
  # Redis 配置（仅在 extend.redis.enabled=true 时生效）
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:zintis}
      database: ${SPRING_DATA_REDIS_DATABASE:3}
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 5
          min-idle: 2
          max-wait: 5000
  # 排除 Redis 自动配置（当 extend.redis.enabled=false 时）
#  autoconfigure:
#    exclude:
#      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
#      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
#      - cn.dev33.satoken.dao.SaTokenDaoForRedisTemplate  # 排除 Sa-Token Redis 自动配置
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${SPRING_DATASOURCE_USERNAME:magic}
    password: ${SPRING_DATASOURCE_PASSWORD:Magic@2026}
    druid:
      # 下面为连接池的补充设置，应用到上面所有数据源中
      # 初始化大小，最小，最大
      initial-size: 5
      min-idle: 5
      max-active: 1000
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      pool-prepared-statements: true
      #   配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      use-global-data-source-stat: true
      # 配置监控服务器
      stat-view-servlet:
        enabled: true
        login-username: admin
        login-password: 123456
        reset-enable: false
        url-pattern: /druid/*
        # 添加IP白名单
        allow: ""
        # 添加IP黑名单，当白名单和黑名单重复时，黑名单优先级更高
        #deny:
      web-stat-filter:
        # 添加过滤规则
        url-pattern: /*
        # 忽略过滤格式
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
  flyway:
    enabled: false
    locations: classpath:db/migration,classpath:db/seed/prod
    baseline-on-migrate: true
    baseline-version: "20260329.005"
    validate-on-migrate: true
    url: ${SPRING_FLYWAY_URL:${spring.datasource.url}}
    user: ${SPRING_FLYWAY_USER:${spring.datasource.username}}
    password: ${SPRING_FLYWAY_PASSWORD:${spring.datasource.password}}

magic-api:
  web: /magic/web
  show-sql: true #配置打印SQL
  sql-column-case: camel
  resource:
    location: data/magic-api
    table-name: magic_api_file
  backup: #备份相关配置
    enable: true #是否启用
    max-history: -1 #备份保留天数，-1为永久保留
    table-name: magic_backup_record #使用数据库存储备份时的表名
  page:
    page: pageNo
    size: pageSize
    default-page: 1
    default-page-size: 20
  cache:
    enable: true  #开启缓存，默认是不开启的
    ttl: 3600000 #有效期1小时，默认-1 即永不过期
  response-code:
    success: 200 #执行成功的code值
    invalid: 400 #参数验证未通过的code值
    exception: 500 #执行出现异常的code值
  crud: # CRUD相关配置
    logic-delete-column: is_del #逻辑删除列
    logic-delete-value: 1 #逻辑删除值
  security:
    username: admin
    password: K7vQ9@xP4Lr2!mZ8
#  swagger:
#    version: 1.0
#    description: MagicAPI 接口信息
#    title: MagicAPI Swagger Docs
#    name: MagicAPI 接口
#    location: /v2/api-docs/magic-api/swagger2.json
  springdoc:
    version: 1.0
    description: MagicAPI 接口信息
    title: MagicAPI OpenAPI Docs
    name: MagicAPI 接口
    location: /v3/api-docs/magic-api/openapi.json
    groupName: magic-api
    external-docs:
      description: Find out more about Swagger  # Redis 配置（仅在 extend.redis.enabled=true 时生效）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: zintis
      database: 3
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 5
          min-idle: 2
          max-wait: 5000
      url: https://swagger.io
    # 联系人配置（可选）
    contact:
      name: MagicAPI Support
      email: support@example.com
    # 许可证配置（可选）
    license:
      name: MIT
      url: https://opensource.org/licenses/MIT
  date-pattern:
    - yyyy-MM-dd
    - yyyy-MM-dd HH:mm:ss
  editor-config: classpath:./magic-editor-config.js
  auto-import-module: db, anyline, trans


# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # token前缀
  token-prefix: Bearer
  # token有效期，单位s 默认30天, -1代表永不过期
  timeout: 2592000
  # token临时有效期 (指定时间内无操作就视为token过期) 单位: 秒
  active-timeout: -1
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # token风格
  token-style: tik
  # 是否输出操作日志
  is-log: false

oss:
  enable: false
  endpoint: ""
  accessKeyId: ""
  accessKeySecret: ""
  roleArn: ""
  roleSessionName: ""
  bucket: ""
  bucketDomain: ""

forest:
  variables:
    username: foo      # 声明全局变量，变量名: username，变量值: foo
    userpwd: bar       # 声明全局变量，变量名: userpwd，变量值: bar
  backend: okhttp3             # 后端HTTP框架（默认为 okhttp3）
  max-connections: 1000        # 连接池最大连接数（默认为 500）
  max-route-connections: 500   # 每个路由的最大连接数（默认为 500）
  max-request-queue-size: 100  # [自v1.5.22版本起可用] 最大请求等待队列大小
  max-async-thread-size: 300   # [自v1.5.21版本起可用] 最大异步线程数
  max-async-queue-size: 16     # [自v1.5.22版本起可用] 最大异步线程池队列大小
  timeout: 3000                # [已不推荐使用] 请求超时时间，单位为毫秒（默认为 3000）
  connect-timeout: 3000        # 连接超时时间，单位为毫秒（默认为 timeout）
  read-timeout: 3000           # 数据读取超时时间，单位为毫秒（默认为 timeout）
  max-retry-count: 0           # 请求失败后重试次数（默认为 0 次不重试）
  ssl-protocol: TLS            # 单向验证的HTTPS的默认TLS协议（默认为 TLS）
  log-enabled: true            # 打开或关闭日志（默认为 true）
  log-request: true            # 打开/关闭Forest请求日志（默认为 true）
  log-response-status: true    # 打开/关闭Forest响应状态日志（默认为 true）
  log-response-content: true   # 打开/关闭Forest响应内容日志（默认为 false）
#  log-response-headers: true   # 打开/关闭Forest响应头日志
  async-mode: platform         # [自v1.5.27版本起可用] 异步模式（默认为 platform）


liteflow:
  #规则文件路径
#  rule-source: config/flow.xml
  #-----------------以下非必须-----------------
  #liteflow是否开启，默认为true
  enable: true
  #liteflow的banner打印是否开启，默认为true
  print-banner: true
  #上下文的初始数量槽，默认值为1024，这个值不用刻意配置，这个值会自动扩容
  slot-size: 1024
  #FlowExecutor的execute2Future的线程数，默认为64
  main-executor-works: 64
  #FlowExecutor的execute2Future的自定义线程池Builder，LiteFlow提供了默认的Builder
  main-executor-class: com.yomahub.liteflow.thread.LiteFlowDefaultMainExecutorBuilder
  #自定义请求ID的生成类，LiteFlow提供了默认的生成类
  request-id-generator-class: com.yomahub.liteflow.flow.id.DefaultRequestIdGenerator
  #全局异步节点线程池大小，默认为64
  global-thread-pool-size: 64
  #全局异步节点线程池队列大小，默认为512
  global-thread-pool-queue-size: 512
  #全局异步节点线程池自定义Builder，LiteFlow提供了默认的线程池Builder
  global-thread-pool-executor-class: com.yomahub.liteflow.thread.LiteFlowDefaultGlobalExecutorBuilder
  #异步线程最长的等待时间(只用于when)，默认值为15000
  when-max-wait-time: 15000
  #异步线程最长的等待时间(只用于when)，默认值为MILLISECONDS，毫秒
  when-max-wait-time-unit: MILLISECONDS
  #每个WHEN是否用单独的线程池
  when-thread-pool-isolate: false
  #设置解析模式，一共有三种模式，PARSE_ALL_ON_START | PARSE_ALL_ON_FIRST_EXEC | PARSE_ONE_ON_FIRST_EXEC
  parse-mode: PARSE_ONE_ON_FIRST_EXEC
  #全局重试次数，默认为0
  retry-count: 0
  #是否支持不同类型的加载方式混用，默认为false
  support-multiple-type: false
  #全局默认节点执行器
  node-executor-class: com.yomahub.liteflow.flow.executor.DefaultNodeExecutor
  #是否打印执行中过程中的日志，默认为true
  print-execution-log: true
  #是否开启本地文件监听，默认为false
  enable-monitor-file: false
  #是否开启快速解析模式，默认为false
  fast-load: false
  #是否开启Node节点实例ID持久化，默认为false
  enable-node-instance-id: false
  #是否开启虚拟线程(只在JDK21+环境有效)，默认为true
  enable-virtual-thread: true
  #简易监控配置选项
  monitor:
    #监控是否开启，默认不开启
    enable-log: false
    #监控队列存储大小，默认值为200
    queue-limit: 200
    #监控一开始延迟多少执行，默认值为300000毫秒，也就是5分钟
    delay: 300000
    #监控日志打印每过多少时间执行一次，默认值为300000毫秒，也就是5分钟
    period: 300000

# MyBatis Plus 配置
mybatis-plus:
  # Mapper XML 文件位置
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体类扫描路径
  type-aliases-package: org.ssssssss.magicboot.**.model
  # 配置
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  # 全局配置
  global-config:
    # 数据库配置
    db-config:
      # 主键类型（AUTO 自增，ASSIGN_ID 雪花算法）
      id-type: AUTO
      # 逻辑删除字段名
      logic-delete-field: isDel
      # 逻辑删除值
      logic-delete-value: 1
      # 逻辑未删除值
      logic-not-delete-value: 0
      # 字段策略
      insert-strategy: not_null
      update-strategy: not_null
    # 关闭 Banner
    banner: false

plugin:
  enabled: true              # 是否启用插件系统
  dir: ./plugins/           # 插件目录
  auto-load: true            # 启动时自动加载插件
  auto-start: true           # 加载后自动启动插件
  init-sync-on-startup: true # 启动后将运行态插件增量同步到数据库

# Tiga 脚本引擎配置
tiga:
  engine:
    enabled: true
    core-pool-size: 4       # CPU 核数 * 2（根据实际机器调整）
    max-pool-size: 8        # CPU 核数 * 4
    queue-capacity: 2000
    max-cache-size: 500
