<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>库位-巷道灯绑定</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
    }
    .top-link {
      margin-bottom: 10px;
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .hero {
      margin-bottom: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 60%, #3b82f6 100%);
      color: #fff;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
    }
    .hero h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
    }
    .hero p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }
    .panel {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui/dist/index.prod.js"></script>
  <script>
    (function () {
      var ref = Vue.ref;
      var computed = Vue.computed;
      var onMounted = Vue.onMounted;
      var createApp = Vue.createApp;
      var h = Vue.h;

      function trim(value) {
        if (value == null) return "";
        return String(value).replace(/^\s+|\s+$/g, "");
      }

      function request(method, url, payload) {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open(method, url, true);
          xhr.timeout = 15000;
          if (method === "POST") xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            var text = xhr.responseText || "";
            var json = null;
            try { json = JSON.parse(text); } catch (e) {}
            resolve({ status: xhr.status, text: text, json: json });
          };
          xhr.onerror = function () { reject(new Error("网络异常，请检查服务是否可用")); };
          xhr.ontimeout = function () { reject(new Error("请求超时(15s)")); };
          if (method === "POST") xhr.send(JSON.stringify(payload));
          else xhr.send();
        });
      }

      createApp({
        setup: function () {
          var tab = ref("create");
          var loading = ref(false);
          var deviceLoading = ref(false);

          var createModel = ref({
            lotNo: "",
            ledId: "",
            color: "RED"
          });
          var deleteModel = ref({ lotNo: "" });

          var deviceOptions = ref([]);

          var colorOptions = [
            { label: "1-RED（红色，第1层）", value: "RED" },
            { label: "2-YELLOW（黄色，第2层）", value: "YELLOW" },
            { label: "3-GREEN（绿色，第3层）", value: "GREEN" }
          ];

          var statusType = ref("info");
          var statusText = ref("就绪，等待操作。");

          function setStatus(type, text) {
            statusType.value = type;
            statusText.value = text;
          }

          function parseResult(result) {
            var json = result.json;
            var code = json && json.code;
            var msg = json && json.message;
            var data = json && json.data;
            var isHttpOk = result.status >= 200 && result.status < 300;
            var isApiOk = json ? Number(code) === 200 : false;
            return {
              success: isHttpOk && isApiOk,
              message: msg || "",
              data: data,
              fallback: result.text || ("HTTP " + result.status)
            };
          }

          async function loadDevices() {
            deviceLoading.value = true;
            try {
              var result = await request("GET", "/api/location/led-devices");
              var parsed = parseResult(result);
              if (!parsed.success) {
                setStatus("error", "巷道灯设备加载失败：" + (parsed.message || parsed.fallback));
                deviceOptions.value = [];
                return;
              }
              var list = parsed.data || [];
              var options = [];
              for (var i = 0; i < list.length; i++) {
                var item = list[i] || {};
                var macAddress = trim(item.macAddress || item.mac_address);
                var ip = trim(item.ip || item.ipAddress || item.ip_address);
                var remark = trim(item.remark);
                if (!macAddress) continue;
                var displayIp = ip || "未知IP";
                var label = remark ? (remark + "（" + displayIp + "）") : displayIp;
                options.push({ label: label, value: macAddress });
              }
              deviceOptions.value = options;
              if (!createModel.value.ledId && options.length > 0) {
                createModel.value.ledId = options[0].value;
              }
            } catch (err) {
              setStatus("error", "巷道灯设备加载失败：" + err.message);
              deviceOptions.value = [];
            } finally {
              deviceLoading.value = false;
            }
          }

          async function onCreate() {
            if (loading.value) return;
            var lotNo = trim(createModel.value.lotNo);
            var ledId = trim(createModel.value.ledId);
            var color = trim(createModel.value.color);
            if (!lotNo) {
              setStatus("error", "创建失败：lotNo 不能为空");
              return;
            }
            if (!ledId) {
              setStatus("error", "创建失败：ledId 不能为空");
              return;
            }
            if (!color) {
              setStatus("error", "创建失败：color 不能为空");
              return;
            }
            loading.value = true;
            setStatus("info", "创建中，请稍候...");
            try {
              var result = await request("POST", "/api/location/led-mapping", {
                lotNo: lotNo,
                ledId: ledId,
                color: color
              });
              var parsed = parseResult(result);
              if (parsed.success) {
                setStatus("success", "创建成功：" + (parsed.message || "success"));
                createModel.value.lotNo = "";
              } else {
                setStatus("error", "创建失败：" + (parsed.message || parsed.fallback));
              }
            } catch (err) {
              setStatus("error", "请求失败：" + err.message);
            } finally {
              loading.value = false;
            }
          }

          async function onDelete() {
            if (loading.value) return;
            var lotNo = trim(deleteModel.value.lotNo);
            if (!lotNo) {
              setStatus("error", "删除失败：lotNo 不能为空");
              return;
            }
            loading.value = true;
            setStatus("info", "删除中，请稍候...");
            try {
              var result = await request("DELETE", "/api/location/led-mapping?lotNo=" + encodeURIComponent(lotNo));
              var parsed = parseResult(result);
              if (parsed.success && Number(parsed.data) === 0) {
                setStatus("warning", "删除失败：库位码不存在");
              } else if (parsed.success) {
                setStatus("success", "删除成功：" + (parsed.message || "success"));
                deleteModel.value.lotNo = "";
              } else {
                setStatus("error", "删除失败：" + (parsed.message || parsed.fallback));
              }
            } catch (err) {
              setStatus("error", "请求失败：" + err.message);
            } finally {
              loading.value = false;
            }
          }

          onMounted(function () { loadDevices(); });

          var statusAlertType = computed(function () {
            if (statusType.value === "success") return "success";
            if (statusType.value === "error") return "error";
            if (statusType.value === "warning") return "warning";
            return "info";
          });

          return {
            tab: tab,
            loading: loading,
            deviceLoading: deviceLoading,
            createModel: createModel,
            deleteModel: deleteModel,
            deviceOptions: deviceOptions,
            colorOptions: colorOptions,
            statusText: statusText,
            statusAlertType: statusAlertType,
            onCreate: onCreate,
            onDelete: onDelete,
            loadDevices: loadDevices
          };
        },
        render: function () {
          var self = this;
          return h(naive.NConfigProvider, null, {
            default: function () {
              return h(naive.NMessageProvider, null, {
                default: function () {
                  return h("div", { class: "page" }, [
                    h(naive.NButton, {
                      quaternary: true,
                      size: "small",
                      style: "margin-bottom:10px;",
                      onClick: function () { window.location.href = "./mapping-entry.html"; }
                    }, {
                      icon: function () {
                        return h(naive.NIcon, { size: 16 }, {
                          default: function () {
                            return h("svg", {
                              viewBox: "0 0 24 24",
                              fill: "none",
                              stroke: "currentColor",
                              "stroke-width": "2",
                              "stroke-linecap": "round",
                              "stroke-linejoin": "round"
                            }, [
                              h("path", { d: "M15 18L9 12L15 6" }),
                              h("path", { d: "M9 12H21" })
                            ]);
                          }
                        });
                      },
                      default: function () { return "返回入口导航"; }
                    }),
                    h("div", { class: "hero" }, [
                      h("h1", null, "库位-巷道灯绑定"),
                      h("p", null, "设备下拉显示 IP，提交使用 MAC 地址")
                    ]),
                    h(naive.NCard, { class: "panel", bordered: false }, {
                      default: function () {
                        return [
                          h(naive.NTabs, {
                            type: "segment",
                            animated: true,
                            value: self.tab,
                            "onUpdate:value": function (v) { self.tab = v; }
                          }, {
                            default: function () {
                              return [
                                h(naive.NTabPane, { name: "create", tab: "创建绑定" }, {
                                  default: function () {
                                    return [
                                      h(naive.NForm, { labelPlacement: "top", showFeedback: false }, {
                                        default: function () {
                                          return [
                                            h(naive.NFormItem, { label: "库位码 lotNo" }, {
                                              default: function () {
                                                return h(naive.NInput, {
                                                  clearable: true,
                                                  placeholder: "请扫码或输入 lotNo",
                                                  value: self.createModel.lotNo,
                                                  "onUpdate:value": function (v) { self.createModel.lotNo = v; },
                                                  onKeyup: function (e) { if (e.key === "Enter") self.onCreate(); }
                                                });
                                              }
                                            }),
                                            h(naive.NFormItem, { label: "巷道灯设备（显示 IP，提交 MAC）" }, {
                                              default: function () {
                                                return h(naive.NSelect, {
                                                  filterable: true,
                                                  clearable: true,
                                                  placeholder: self.deviceLoading ? "设备加载中..." : "请选择巷道灯设备",
                                                  loading: self.deviceLoading,
                                                  options: self.deviceOptions,
                                                  value: self.createModel.ledId,
                                                  "onUpdate:value": function (v) { self.createModel.ledId = v || ""; }
                                                });
                                              }
                                            }),
                                            h(naive.NFormItem, { label: "绑定颜色" }, {
                                              default: function () {
                                                return h(naive.NSelect, {
                                                  options: self.colorOptions,
                                                  value: self.createModel.color,
                                                  "onUpdate:value": function (v) { self.createModel.color = v; }
                                                });
                                              }
                                            }),
                                            h(naive.NSpace, { vertical: true, size: 8 }, {
                                              default: function () {
                                                return [
                                                  h(naive.NButton, {
                                                    type: "primary",
                                                    block: true,
                                                    strong: true,
                                                    loading: self.loading,
                                                    onClick: self.onCreate
                                                  }, { default: function () { return "提交创建"; } }),
                                                  h(naive.NButton, {
                                                    dashed: true,
                                                    block: true,
                                                    onClick: self.loadDevices,
                                                    disabled: self.loading
                                                  }, { default: function () { return "刷新设备列表"; } }),
                                                  h("div", { style: "color:#64748b;font-size:13px;" }, "提示：扫码后回车可直接提交，默认绑定 RED（第1层）。")
                                                ];
                                              }
                                            })
                                          ];
                                        }
                                      })
                                    ];
                                  }
                                }),
                                h(naive.NTabPane, { name: "delete", tab: "删除绑定" }, {
                                  default: function () {
                                    return [
                                      h(naive.NForm, { labelPlacement: "top", showFeedback: false }, {
                                        default: function () {
                                          return [
                                            h(naive.NFormItem, { label: "库位码 lotNo" }, {
                                              default: function () {
                                                return h(naive.NInput, {
                                                  clearable: true,
                                                  placeholder: "请扫码或输入 lotNo",
                                                  value: self.deleteModel.lotNo,
                                                  "onUpdate:value": function (v) { self.deleteModel.lotNo = v; },
                                                  onKeyup: function (e) { if (e.key === "Enter") self.onDelete(); }
                                                });
                                              }
                                            }),
                                            h(naive.NButton, {
                                              type: "error",
                                              block: true,
                                              strong: true,
                                              loading: self.loading,
                                              onClick: self.onDelete
                                            }, { default: function () { return "提交删除"; } }),
                                            h("div", { style: "margin-top:8px;color:#64748b;font-size:13px;" }, "提示：删除通过 lotNo 定位绑定记录。")
                                          ];
                                        }
                                      })
                                    ];
                                  }
                                })
                              ];
                            }
                          })
                        ];
                      }
                    }),
                    h(naive.NCard, { class: "panel", title: "操作状态", bordered: false }, {
                      default: function () {
                        return h(naive.NAlert, {
                          type: self.statusAlertType,
                          showIcon: true,
                          bordered: false
                        }, { default: function () { return self.statusText; } });
                      }
                    })
                  ]);
                }
              });
            }
          });
        }
      }).mount("#app");
    })();
  </script>
</body>
</html>
