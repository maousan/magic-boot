<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>库位码-电子标签绑定</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      color: #1f2937;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px;
    }
    .entry-link {
      display: inline-block;
      margin: 0 0 10px;
      color: #1d4ed8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .title {
      margin: 0 0 12px;
      padding: 10px 12px;
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .tabs {
      display: flex;
      margin-bottom: 10px;
      border-bottom: 1px solid #cbd5e1;
      gap: 0;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      height: 42px;
      line-height: 42px;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 8px 8px 0 0;
      color: #475569;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: -1px;
      background: transparent;
      cursor: pointer;
    }
    .tab-item.active {
      border-color: #cbd5e1;
      background: #fff;
      color: #1d4ed8;
      font-weight: 700;
    }
    .form-pane { display: none; }
    .form-pane.active { display: block; }
    .row { margin-bottom: 10px; }
    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #374151;
      font-weight: 600;
    }
    .input-wrap { position: relative; }
    .input {
      width: 100%;
      height: 46px;
      border: 1px solid #cfd6df;
      border-radius: 8px;
      padding: 0 44px 0 12px;
      font-size: 16px;
      background: #fff;
      color: #111827;
      outline: none;
    }
    .input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12);
    }
    .clear-btn {
      position: absolute;
      right: 6px;
      top: 5px;
      width: 36px;
      height: 36px;
      line-height: 36px;
      border: 0;
      border-radius: 18px;
      background: #e5e7eb;
      color: #334155;
      font-size: 20px;
      font-weight: 700;
      display: none;
      cursor: pointer;
      padding: 0;
    }
    .btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: #1d4ed8;
      cursor: pointer;
    }
    .btn.danger { background: #b91c1c; }
    .btn:disabled { opacity: 0.62; cursor: not-allowed; }
    .tip {
      font-size: 13px;
      color: #6b7280;
      margin-top: 8px;
    }
    .status {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      font-size: 14px;
      color: #374151;
      min-height: 44px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .status.success {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
    }
    .status.error {
      border-color: #fca5a5;
      background: #fef2f2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="entry-link" href="./mapping-entry.html">&lt; 返回入口导航</a>
    <h1 class="title">库位码-电子标签绑定</h1>

    <div class="panel">
      <div class="tabs">
        <a class="tab-item active" id="tabCreate" href="javascript:void(0);">创建绑定</a>
        <a class="tab-item" id="tabDelete" href="javascript:void(0);">解绑绑定</a>
      </div>

      <div class="form-pane active" id="createPanel">
        <div class="row">
          <label class="label" for="createLocationCode">库位码 locationCode</label>
          <div class="input-wrap">
            <input class="input" id="createLocationCode" type="text" autocomplete="off" placeholder="请扫码或输入 locationCode" />
            <button class="clear-btn" type="button" data-target="createLocationCode" aria-label="clear">&times;</button>
          </div>
        </div>
        <div class="row">
          <label class="label" for="createLabelCode">电子标签码 labelCode</label>
          <div class="input-wrap">
            <input class="input" id="createLabelCode" type="text" autocomplete="off" placeholder="请扫码或输入 labelCode" />
            <button class="clear-btn" type="button" data-target="createLabelCode" aria-label="clear">&times;</button>
          </div>
        </div>
        <button class="btn" id="createBtn" type="button">提交创建</button>
        <div class="tip">提示：创建绑定会调用本地接口并保存映射。</div>
      </div>

      <div class="form-pane" id="deletePanel">
        <div class="row">
          <label class="label" for="deleteLabelCode">电子标签码 labelCode</label>
          <div class="input-wrap">
            <input class="input" id="deleteLabelCode" type="text" autocomplete="off" placeholder="请扫码或输入 labelCode" />
            <button class="clear-btn" type="button" data-target="deleteLabelCode" aria-label="clear">&times;</button>
          </div>
        </div>
        <button class="btn danger" id="deleteBtn" type="button">提交解绑</button>
        <div class="tip">提示：解绑会先调用 AIMS 解绑，再删除本地映射。</div>
      </div>
    </div>

    <div class="panel">
      <h2 style="margin:0 0 10px;font-size:18px;color:#111827;">操作状态</h2>
      <div class="status" id="statusBar">就绪，等待操作。</div>
    </div>
  </div>

  <script>
    (function () {
      var activeForm = "create";
      var isSubmitting = false;

      var createLocationCodeEl = document.getElementById("createLocationCode");
      var createLabelCodeEl = document.getElementById("createLabelCode");
      var deleteLabelCodeEl = document.getElementById("deleteLabelCode");
      var createBtnEl = document.getElementById("createBtn");
      var deleteBtnEl = document.getElementById("deleteBtn");
      var statusBarEl = document.getElementById("statusBar");
      var tabCreateEl = document.getElementById("tabCreate");
      var tabDeleteEl = document.getElementById("tabDelete");
      var createPanelEl = document.getElementById("createPanel");
      var deletePanelEl = document.getElementById("deletePanel");
      var clearBtnEls = document.getElementsByClassName("clear-btn");

      function trim(value) {
        if (value == null) return "";
        return String(value).replace(/^\s+|\s+$/g, "");
      }

      function setStatus(type, text) {
        statusBarEl.className = "status" + (type ? " " + type : "");
        statusBarEl.innerHTML = text;
      }

      function getClearBtn(targetId) {
        var i;
        for (i = 0; i < clearBtnEls.length; i++) {
          if (clearBtnEls[i].getAttribute("data-target") === targetId) return clearBtnEls[i];
        }
        return null;
      }

      function toggleClearBtn(inputEl) {
        if (!inputEl || !inputEl.id) return;
        var btn = getClearBtn(inputEl.id);
        if (!btn) return;
        btn.style.display = trim(inputEl.value) ? "block" : "none";
      }

      function bindClearFeature(inputEl) {
        if (!inputEl) return;
        inputEl.oninput = function () { toggleClearBtn(inputEl); };
        inputEl.onkeyup = function () { toggleClearBtn(inputEl); };
        inputEl.onchange = function () { toggleClearBtn(inputEl); };
        toggleClearBtn(inputEl);
      }

      function setBusy(flag) {
        isSubmitting = !!flag;
        createBtnEl.disabled = isSubmitting;
        deleteBtnEl.disabled = isSubmitting;
      }

      function parseJsonSafely(text) {
        if (!text) return null;
        try { return JSON.parse(text); } catch (e) { return null; }
      }

      function request(method, url, payload, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.timeout = 15000;
        if (method === "POST") xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");

        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          callback(null, {
            status: xhr.status,
            bodyText: xhr.responseText || "",
            bodyJson: parseJsonSafely(xhr.responseText || "")
          });
        };
        xhr.onerror = function () { callback(new Error("网络异常，请检查服务是否可用")); };
        xhr.ontimeout = function () { callback(new Error("请求超时(15s)")); };
        if (method === "POST") xhr.send(JSON.stringify(payload));
        else xhr.send();
      }

      function handleApiResponse(err, result) {
        setBusy(false);
        if (err) {
          setStatus("error", "请求失败：" + err.message);
          return;
        }
        var bodyJson = result.bodyJson;
        var code = bodyJson && bodyJson.code;
        var message = bodyJson && bodyJson.message;
        var data = bodyJson && bodyJson.data;
        var isHttpOk = result.status >= 200 && result.status < 300;
        var hasApiCode = bodyJson && code != null;
        var apiCode = hasApiCode ? Number(code) : null;
        var isApiFailure = hasApiCode && apiCode !== 200 && apiCode !== 0;
        var success = isHttpOk && !isApiFailure;

        if (success && activeForm === "delete" && Number(data) === 0) {
          setStatus("error", "解绑失败：未找到对应绑定关系");
          return;
        }
        if (success) {
          setStatus("success", "操作成功：" + (message || "success"));
          createLocationCodeEl.value = "";
          createLabelCodeEl.value = "";
          deleteLabelCodeEl.value = "";
          toggleClearBtn(createLocationCodeEl);
          toggleClearBtn(createLabelCodeEl);
          toggleClearBtn(deleteLabelCodeEl);
          if (activeForm === "delete") deleteLabelCodeEl.focus();
          else createLocationCodeEl.focus();
        } else {
          setStatus("error", "操作失败：" + (message || result.bodyText || ("HTTP " + result.status)));
        }
      }

      function createMapping() {
        if (isSubmitting) return;
        var locationCode = trim(createLocationCodeEl.value);
        var labelCode = trim(createLabelCodeEl.value);
        if (!locationCode) { setStatus("error", "创建失败：locationCode 不能为空"); createLocationCodeEl.focus(); return; }
        if (!labelCode) { setStatus("error", "创建失败：labelCode 不能为空"); createLabelCodeEl.focus(); return; }
        setBusy(true);
        setStatus("", "创建中，请稍候...");
        request("POST", "/api/location/label-mapping", { locationCode: locationCode, labelCode: labelCode }, handleApiResponse);
      }

      function deleteMapping() {
        if (isSubmitting) return;
        var labelCode = trim(deleteLabelCodeEl.value);
        if (!labelCode) { setStatus("error", "解绑失败：labelCode 不能为空"); deleteLabelCodeEl.focus(); return; }
        setBusy(true);
        setStatus("", "解绑中，请稍候...");
        var url = "/api/location/label-mapping?labelCode=" + encodeURIComponent(labelCode);
        request("DELETE", url, { labelCode: labelCode }, handleApiResponse);
      }

      function switchTab(tabName) {
        activeForm = tabName;
        if (tabName === "delete") {
          tabCreateEl.className = "tab-item";
          tabDeleteEl.className = "tab-item active";
          createPanelEl.className = "form-pane";
          deletePanelEl.className = "form-pane active";
          deleteLabelCodeEl.focus();
        } else {
          tabCreateEl.className = "tab-item active";
          tabDeleteEl.className = "tab-item";
          createPanelEl.className = "form-pane active";
          deletePanelEl.className = "form-pane";
          createLocationCodeEl.focus();
        }
      }

      tabCreateEl.onclick = function () { switchTab("create"); };
      tabDeleteEl.onclick = function () { switchTab("delete"); };
      createBtnEl.onclick = function () { switchTab("create"); createMapping(); };
      deleteBtnEl.onclick = function () { switchTab("delete"); deleteMapping(); };

      bindClearFeature(createLocationCodeEl);
      bindClearFeature(createLabelCodeEl);
      bindClearFeature(deleteLabelCodeEl);

      var i;
      for (i = 0; i < clearBtnEls.length; i++) {
        clearBtnEls[i].onclick = (function (btnRef) {
          return function () {
            var targetId = btnRef.getAttribute("data-target");
            var inputEl = document.getElementById(targetId);
            if (!inputEl) return;
            inputEl.value = "";
            toggleClearBtn(inputEl);
            inputEl.focus();
          };
        })(clearBtnEls[i]);
      }

      switchTab("create");
    })();
  </script>
</body>
</html>
