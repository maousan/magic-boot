<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>库位码-电子标签绑定</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #f1f5f9 0%, #f8fafc 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
    }
    .top-link {
      margin-bottom: 10px;
      display: inline-block;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .hero {
      margin-bottom: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 60%, #14b8a6 100%);
      color: #fff;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.25);
    }
    .hero h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.2;
    }
    .hero p {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.95;
    }
    .panel {
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui/dist/index.prod.js"></script>
  <script>
    (function () {
      var ref = Vue.ref;
      var computed = Vue.computed;
      var createApp = Vue.createApp;
      var h = Vue.h;

      function trim(value) {
        if (value == null) return "";
        return String(value).replace(/^\s+|\s+$/g, "");
      }

      function request(method, url, payload) {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open(method, url, true);
          xhr.timeout = 15000;
          if (method === "POST") xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
          xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) return;
            var text = xhr.responseText || "";
            var json = null;
            try { json = JSON.parse(text); } catch (e) {}
            resolve({ status: xhr.status, text: text, json: json });
          };
          xhr.onerror = function () { reject(new Error("网络异常，请检查服务是否可用")); };
          xhr.ontimeout = function () { reject(new Error("请求超时(15s)")); };
          if (method === "POST") xhr.send(JSON.stringify(payload));
          else xhr.send();
        });
      }

      createApp({
        setup: function () {
          var tab = ref("create");
          var loading = ref(false);

          var createModel = ref({ locationCode: "", labelCode: "" });
          var deleteModel = ref({ labelCode: "" });

          var statusType = ref("info");
          var statusText = ref("就绪，等待操作。");

          function setStatus(type, text) {
            statusType.value = type;
            statusText.value = text;
          }

          function parseResult(result) {
            var json = result.json;
            var code = json && json.code;
            var msg = json && json.message;
            var data = json && json.data;
            var isHttpOk = result.status >= 200 && result.status < 300;
            var hasApiCode = json && code != null;
            var isApiFailure = hasApiCode && Number(code) !== 200 && Number(code) !== 0;
            return {
              success: isHttpOk && !isApiFailure,
              message: msg || "",
              data: data,
              fallback: result.text || ("HTTP " + result.status)
            };
          }

          async function onCreate() {
            if (loading.value) return;
            var locationCode = trim(createModel.value.locationCode);
            var labelCode = trim(createModel.value.labelCode);
            if (!locationCode) {
              setStatus("error", "创建失败：locationCode 不能为空");
              return;
            }
            if (!labelCode) {
              setStatus("error", "创建失败：labelCode 不能为空");
              return;
            }
            loading.value = true;
            setStatus("info", "创建中，请稍候...");
            try {
              var result = await request("POST", "/api/location/label-mapping", {
                locationCode: locationCode,
                labelCode: labelCode
              });
              var parsed = parseResult(result);
              if (parsed.success) {
                setStatus("success", "创建成功：" + (parsed.message || "success"));
                createModel.value.locationCode = "";
                createModel.value.labelCode = "";
              } else {
                setStatus("error", "创建失败：" + (parsed.message || parsed.fallback));
              }
            } catch (err) {
              setStatus("error", "请求失败：" + err.message);
            } finally {
              loading.value = false;
            }
          }

          async function onDelete() {
            if (loading.value) return;
            var labelCode = trim(deleteModel.value.labelCode);
            if (!labelCode) {
              setStatus("error", "解绑失败：labelCode 不能为空");
              return;
            }
            loading.value = true;
            setStatus("info", "解绑中，请稍候...");
            try {
              var result = await request("DELETE", "/api/location/label-mapping?labelCode=" + encodeURIComponent(labelCode));
              var parsed = parseResult(result);
              if (parsed.success && Number(parsed.data) === 0) {
                setStatus("warning", "解绑失败：未找到对应绑定关系");
              } else if (parsed.success) {
                setStatus("success", "解绑成功：" + (parsed.message || "success"));
                deleteModel.value.labelCode = "";
              } else {
                setStatus("error", "解绑失败：" + (parsed.message || parsed.fallback));
              }
            } catch (err) {
              setStatus("error", "请求失败：" + err.message);
            } finally {
              loading.value = false;
            }
          }

          var statusAlertType = computed(function () {
            if (statusType.value === "success") return "success";
            if (statusType.value === "error") return "error";
            if (statusType.value === "warning") return "warning";
            return "info";
          });

          return {
            tab: tab,
            loading: loading,
            createModel: createModel,
            deleteModel: deleteModel,
            statusText: statusText,
            statusAlertType: statusAlertType,
            onCreate: onCreate,
            onDelete: onDelete
          };
        },
        render: function () {
          var self = this;
          return h(naive.NConfigProvider, null, {
            default: function () {
              return h(naive.NMessageProvider, null, {
                default: function () {
                  return h("div", { class: "page" }, [
                    h(naive.NButton, {
                      quaternary: true,
                      size: "small",
                      style: "margin-bottom:10px;",
                      onClick: function () { window.location.href = "./mapping-entry.html"; }
                    }, {
                      icon: function () {
                        return h(naive.NIcon, { size: 16 }, {
                          default: function () {
                            return h("svg", {
                              viewBox: "0 0 24 24",
                              fill: "none",
                              stroke: "currentColor",
                              "stroke-width": "2",
                              "stroke-linecap": "round",
                              "stroke-linejoin": "round"
                            }, [
                              h("path", { d: "M15 18L9 12L15 6" }),
                              h("path", { d: "M9 12H21" })
                            ]);
                          }
                        });
                      },
                      default: function () { return "返回入口导航"; }
                    }),
                    h("div", { class: "hero" }, [
                      h("h1", null, "库位码-电子标签绑定"),
                      h("p", null, "创建与解绑一体化，适配 PDA 扫码操作")
                    ]),
                    h(naive.NCard, { class: "panel", bordered: false }, {
                      default: function () {
                        return [
                          h(naive.NTabs, {
                            type: "segment",
                            animated: true,
                            value: self.tab,
                            "onUpdate:value": function (v) { self.tab = v; }
                          }, {
                            default: function () {
                              return [
                                h(naive.NTabPane, { name: "create", tab: "创建绑定" }, {
                                  default: function () {
                                    return [
                                      h(naive.NForm, { labelPlacement: "top", showFeedback: false }, {
                                        default: function () {
                                          return [
                                            h(naive.NFormItem, { label: "库位码 locationCode" }, {
                                              default: function () {
                                                return h(naive.NInput, {
                                                  clearable: true,
                                                  placeholder: "请扫码或输入 locationCode",
                                                  value: self.createModel.locationCode,
                                                  "onUpdate:value": function (v) { self.createModel.locationCode = v; },
                                                  onKeyup: function (e) { if (e.key === "Enter") self.onCreate(); }
                                                });
                                              }
                                            }),
                                            h(naive.NFormItem, { label: "电子标签码 labelCode" }, {
                                              default: function () {
                                                return h(naive.NInput, {
                                                  clearable: true,
                                                  placeholder: "请扫码或输入 labelCode",
                                                  value: self.createModel.labelCode,
                                                  "onUpdate:value": function (v) { self.createModel.labelCode = v; },
                                                  onKeyup: function (e) { if (e.key === "Enter") self.onCreate(); }
                                                });
                                              }
                                            }),
                                            h(naive.NButton, {
                                              type: "primary",
                                              block: true,
                                              strong: true,
                                              loading: self.loading,
                                              onClick: self.onCreate
                                            }, { default: function () { return "提交创建"; } }),
                                            h("div", { style: "margin-top:8px;color:#64748b;font-size:13px;" }, "提示：创建绑定会调用本地接口并保存映射。")
                                          ];
                                        }
                                      })
                                    ];
                                  }
                                }),
                                h(naive.NTabPane, { name: "delete", tab: "解绑绑定" }, {
                                  default: function () {
                                    return [
                                      h(naive.NForm, { labelPlacement: "top", showFeedback: false }, {
                                        default: function () {
                                          return [
                                            h(naive.NFormItem, { label: "电子标签码 labelCode" }, {
                                              default: function () {
                                                return h(naive.NInput, {
                                                  clearable: true,
                                                  placeholder: "请扫码或输入 labelCode",
                                                  value: self.deleteModel.labelCode,
                                                  "onUpdate:value": function (v) { self.deleteModel.labelCode = v; },
                                                  onKeyup: function (e) { if (e.key === "Enter") self.onDelete(); }
                                                });
                                              }
                                            }),
                                            h(naive.NButton, {
                                              type: "error",
                                              block: true,
                                              strong: true,
                                              loading: self.loading,
                                              onClick: self.onDelete
                                            }, { default: function () { return "提交解绑"; } }),
                                            h("div", { style: "margin-top:8px;color:#64748b;font-size:13px;" }, "提示：解绑会先调用 AIMS 解绑，再删除本地映射。")
                                          ];
                                        }
                                      })
                                    ];
                                  }
                                })
                              ];
                            }
                          })
                        ];
                      }
                    }),
                    h(naive.NCard, { class: "panel", title: "操作状态", bordered: false }, {
                      default: function () {
                        return h(naive.NAlert, {
                          type: self.statusAlertType,
                          showIcon: true,
                          bordered: false
                        }, { default: function () { return self.statusText; } });
                      }
                    })
                  ]);
                }
              });
            }
          });
        }
      }).mount("#app");
    })();
  </script>
</body>
</html>
