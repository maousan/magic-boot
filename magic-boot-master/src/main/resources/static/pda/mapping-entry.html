<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PDA 绑定导航</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #f2f4f7;
      color: #1f2937;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px;
    }
    .title {
      margin: 0 0 12px;
      padding: 10px 12px;
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }
    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .desc {
      margin: 0 0 10px;
      color: #4b5563;
      font-size: 14px;
    }
    .nav-card {
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8fbff;
    }
    .nav-card:last-child { margin-bottom: 0; }
    .nav-title {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .nav-tip {
      margin: 0 0 10px;
      font-size: 13px;
      color: #6b7280;
    }
    .nav-btn {
      display: inline-block;
      width: 100%;
      height: 46px;
      line-height: 46px;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      color: #fff;
      background: #1d4ed8;
      font-size: 16px;
      font-weight: 700;
    }
    @media (max-width: 360px) {
      .title { font-size: 20px; }
      .nav-title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="title">PDA 绑定功能导航</h1>

    <div class="panel">
      <p class="desc">请选择要进入的绑定功能页面：</p>

      <div class="nav-card">
        <h2 class="nav-title">库位码 - 巷道灯绑定</h2>
        <p class="nav-tip">用于维护库位码与巷道灯编号的绑定关系。</p>
        <a class="nav-btn" href="./led-mapping.html">进入库位-巷道灯绑定</a>
      </div>

      <div class="nav-card">
        <h2 class="nav-title">库位码 - 电子标签绑定</h2>
        <p class="nav-tip">用于维护库位码与电子标签条码的绑定关系。</p>
        <a class="nav-btn" href="./location-label-mapping.html">进入库位-电子标签绑定</a>
      </div>
    </div>
  </div>
</body>
</html>
