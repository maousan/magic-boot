<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PDA 绑定导航</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd-mobile@5/es/global/global.css" />
  <style>
    * { box-sizing: border-box; }
    html, body, #app {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
    }
    .hero {
      margin-bottom: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #3b82f6 100%);
      color: #fff;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
    }
    .hero-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .hero-subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.92;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .card-desc {
      margin: 8px 0 12px;
      color: #475569;
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/antd-mobile@5/umd/antd-mobile.min.js"></script>
  <script>
    (function () {
      var e = React.createElement;
      var antd = window.antdMobile || window.antd;
      if (!antd) { throw new Error("Ant Design Mobile CDN 加载失败"); }

      var Card = antd.Card;
      var Button = antd.Button;

      var navItems = [
        {
          title: "库位码 - 巷道灯绑定",
          desc: "维护库位码与巷道灯设备绑定关系（设备下拉显示 IP，提交使用 MAC）。",
          href: "./led-mapping.html",
          btn: "进入库位-巷道灯绑定"
        },
        {
          title: "库位码 - 电子标签绑定",
          desc: "维护库位码与电子标签条码的绑定关系。",
          href: "./location-label-mapping.html",
          btn: "进入库位-电子标签绑定"
        }
      ];

      function App() {
        return e("div", { className: "page" }, [
          e("div", { className: "hero", key: "hero" }, [
            e("h1", { className: "hero-title", key: "title" }, "PDA 绑定功能导航"),
            e("p", { className: "hero-subtitle", key: "subtitle" }, "请选择要进入的页面")
          ]),
          e("div", { className: "nav-grid", key: "grid" }, navItems.map(function (item, index) {
            return e(Card, {
              key: "card-" + index,
              style: { borderRadius: 14, boxShadow: "0 2px 8px rgba(15,23,42,0.08)" }
            }, e("div", null, [
              e("h2", { className: "card-title", key: "title" }, item.title),
              e("p", { className: "card-desc", key: "desc" }, item.desc),
              e(Button, {
                key: "btn",
                color: "primary",
                block: true,
                size: "middle",
                onClick: function () { window.location.href = item.href; }
              }, item.btn)
            ]));
          }))
        ]);
      }

      var mountNode = document.getElementById("app");
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(mountNode).render(e(App));
      } else {
        ReactDOM.render(e(App), mountNode);
      }
    })();
  </script>
</body>
</html>
