<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PDA 绑定导航</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #app {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(180deg, #eef2ff 0%, #f8fafc 100%);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 14px;
    }
    .hero {
      margin-bottom: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 55%, #3b82f6 100%);
      color: #fff;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
    }
    .hero-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }
    .hero-subtitle {
      margin: 8px 0 0;
      font-size: 14px;
      opacity: 0.92;
    }
    .nav-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .card-desc {
      margin: 8px 0 12px;
      color: #475569;
      font-size: 14px;
      line-height: 1.45;
    }
    @media (max-width: 360px) {
      .hero-title { font-size: 22px; }
      .card-title { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/naive-ui/dist/index.prod.js"></script>
  <script>
    (function () {
      var createApp = Vue.createApp;
      var h = Vue.h;

      createApp({
        setup: function () {
          var navItems = [
            {
              title: "库位码 - 巷道灯绑定",
              desc: "维护库位码与巷道灯设备绑定关系（设备下拉显示 IP，提交使用 MAC）。",
              href: "./led-mapping.html",
              btn: "进入库位-巷道灯绑定"
            },
            {
              title: "库位码 - 电子标签绑定",
              desc: "维护库位码与电子标签条码的绑定关系。",
              href: "./location-label-mapping.html",
              btn: "进入库位-电子标签绑定"
            },
            {
              title: "亮灯链路模拟测试（PC）",
              desc: "联调 upload / complete / control 的完整链路。",
              href: "./light-chain-simulator.html",
              btn: "进入链路模拟页面"
            }
          ];

          return function () {
            return h(naive.NConfigProvider, null, {
              default: function () {
                return h("div", { class: "page" }, [
                  h("div", { class: "hero" }, [
                    h("h1", { class: "hero-title" }, "PDA 绑定功能导航"),
                    h("p", { class: "hero-subtitle" }, "请选择要进入的页面")
                  ]),
                  h("div", { class: "nav-grid" }, navItems.map(function (item) {
                    return h(naive.NCard, {
                      size: "small",
                      bordered: false,
                      embedded: true,
                      style: "border-radius:14px; box-shadow:0 2px 8px rgba(15,23,42,0.08);"
                    }, {
                      default: function () {
                        return [
                          h("h2", { class: "card-title" }, item.title),
                          h("p", { class: "card-desc" }, item.desc),
                          h(naive.NButton, {
                            type: "primary",
                            strong: true,
                            style: "width:100%;",
                            onClick: function () { window.location.href = item.href; }
                          }, { default: function () { return item.btn; } })
                        ];
                      }
                    });
                  }))
                ]);
              }
            });
          };
        }
      }).mount("#app");
    })();
  </script>
</body>
</html>
