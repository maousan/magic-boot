# Magic Boot 应用服务配置

upstream magic_boot_backend {
    server app:8089;
    keepalive 32;
}

# HTTP 服务器配置
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # 日志配置
    access_log /var/log/nginx/magic_boot_access.log main;
    error_log /var/log/nginx/magic_boot_error.log notice;

    # 上传文件大小限制
    client_max_body_size 200M;

    # Magic API Web 管理界面
    location /magic/web/ {
        proxy_pass http://magic_boot_backend/magic/web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 缓存控制
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Magic API 后端接口
    location /magic/api/ {
        proxy_pass http://magic_boot_backend/magic/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # WebSocket 日志端点
    location /log {
        proxy_pass http://magic_boot_backend/log;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://magic_boot_backend/swagger-ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI 文档
    location /v3/api-docs/ {
        proxy_pass http://magic_boot_backend/v3/api-docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator 健康检查端点（限制访问）
    location /actuator/ {
        # 生产环境建议限制内网访问
        # allow 172.28.0.0/16;
        # deny all;

        proxy_pass http://magic_boot_backend/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Druid 监控（建议限制访问）
    location /druid/ {
        # 生产环境建议限制内网访问
        # allow 172.28.0.0/16;
        # deny all;

        proxy_pass http://magic_boot_backend/druid/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Druid 监控页面特殊处理
        proxy_buffering off;
    }

    # 默认代理到应用
    location / {
        proxy_pass http://magic_boot_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
