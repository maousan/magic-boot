<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>亮灯链路模拟测试（PC）</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --line: #d7deea;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #1d4ed8;
      --success: #0f766e;
      --danger: #b91c1c;
      --mono: "JetBrains Mono", "Consolas", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      min-width: 1280px;
    }
    .wrap {
      width: 1280px;
      margin: 20px auto;
      padding-bottom: 18px;
    }
    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
    }
    .sub {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
      padding: 14px;
      margin-bottom: 12px;
    }
    .section-title {
      margin: 0 0 10px;
      font-size: 18px;
      color: #0f172a;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 12px;
      align-items: start;
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 4px;
    }
    .input,
    .select {
      width: 100%;
      height: 34px;
      border: 1px solid #c9d3e4;
      border-radius: 8px;
      font-size: 13px;
      padding: 0 10px;
      outline: none;
      background: #fff;
      color: #111827;
    }
    .input:focus,
    .select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12);
    }
    .list-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .wave-list {
      border: 1px solid #d3dded;
      border-radius: 10px;
      background: #f8fbff;
      max-height: 520px;
      overflow: auto;
      padding: 8px;
    }
    .wave-item {
      border: 1px solid #d9e2f0;
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .wave-item:last-child { margin-bottom: 0; }
    .wave-item.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.12);
    }
    .wave-main {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .wave-sub {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 2px;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .detail-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
    }
    .table-wrap {
      border: 1px solid #d3dded;
      border-radius: 10px;
      overflow: hidden;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      background: #fff;
    }
    thead th {
      background: #eff4fb;
      color: #334155;
      font-size: 12px;
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid #d5dfef;
    }
    tbody td {
      border-bottom: 1px solid #edf2fa;
      padding: 6px;
      vertical-align: middle;
    }
    tbody tr:last-child td { border-bottom: none; }
    .cell-input {
      width: 100%;
      height: 30px;
      border: 1px solid #c9d3e4;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      outline: none;
    }
    .cell-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.1);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      height: 34px;
      border: 0;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: var(--primary);
    }
    .btn.secondary { background: #475569; }
    .btn.success { background: var(--success); }
    .btn.danger { background: var(--danger); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }
    .status {
      min-height: 40px;
      border: 1px solid #d2ddec;
      border-radius: 8px;
      background: #f8fafc;
      padding: 10px;
      font-size: 13px;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: 10px;
    }
    .status.ok { border-color: #86efac; background: #f0fdf4; color: #166534; }
    .status.err { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    .log {
      width: 100%;
      height: 180px;
      max-height: 180px;
      border: 1px solid #c6cfdf;
      border-radius: 8px;
      background: #0b1220;
      color: #dbeafe;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.45;
      padding: 10px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1 class="title">亮灯链路模拟测试（PC）</h1>
  <p class="sub">业务模拟链路：波次单列表 -> 点击波次选择 -> 手动上传拣货数据 -> 修改明细 -> 完成调用拣货完成接口。</p>

  <div class="panel">
    <h2 class="section-title">通用配置</h2>
    <div class="field-grid">
      <div class="field">
        <label for="apiBase">API Base</label>
        <input id="apiBase" class="input" />
      </div>
      <div class="field">
        <label for="controlMode">control mode</label>
        <select id="controlMode" class="select">
          <option value="1">1 自动亮灯</option>
          <option value="2">2 手动亮灯</option>
          <option value="3" selected>3 自动灭灯</option>
          <option value="4">4 手动灭灯</option>
        </select>
      </div>
      <div class="field">
        <label for="controlColor">control color</label>
        <select id="controlColor" class="select">
          <option>GREEN</option>
          <option>BLUE</option>
          <option>RED</option>
          <option>YELLOW</option>
          <option>CYAN</option>
        </select>
      </div>
      <div class="field">
        <label for="controlDuration">control duration</label>
        <select id="controlDuration" class="select">
          <option value="inf" selected>inf</option>
          <option value="0s">0s</option>
          <option value="10s">10s</option>
          <option value="30s">30s</option>
          <option value="1m">1m</option>
          <option value="2m">2m</option>
          <option value="5m">5m</option>
          <option value="10m">10m</option>
        </select>
      </div>
    </div>
    <div class="hint">API Base 为空时默认当前域名。</div>
  </div>

  <div class="panel">
    <h2 class="section-title">业务模拟</h2>
    <div class="grid-2">
      <div>
        <h3 class="list-title">波次单列表（模拟数据）</h3>
        <div class="field-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 8px;">
          <div class="field">
            <label for="mockWaveCount">波次数量</label>
            <input id="mockWaveCount" class="input" type="number" min="1" max="50" value="5" />
          </div>
          <div class="field">
            <label for="mockDetailCount">每波次明细数</label>
            <input id="mockDetailCount" class="input" type="number" min="1" max="50" value="3" />
          </div>
        </div>
        <div class="actions" style="margin-top: 0; margin-bottom: 8px;">
          <button id="btnGenerateMockData" type="button" class="btn">生成模拟数据</button>
          <button id="btnResetWaves" type="button" class="btn secondary">恢复默认数据</button>
        </div>
        <div id="waveList" class="wave-list"></div>
      </div>

      <div>
        <div class="detail-header">
          <h3 class="detail-title" id="detailTitle">拣货明细信息</h3>
        </div>
        <div class="field-grid" style="grid-template-columns: 2fr 1fr 1fr auto; margin-bottom: 8px;">
          <div class="field">
            <label for="currentWaveNo">当前波次 waveNo</label>
            <input id="currentWaveNo" class="input" />
          </div>
          <div class="field">
            <label for="currentUserId">当前用户 userId</label>
            <input id="currentUserId" class="input" />
          </div>
          <div class="field">
            <label for="currentUserName">当前用户 userName</label>
            <input id="currentUserName" class="input" />
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button id="btnApplyWaveMeta" type="button" class="btn secondary">应用到当前波次</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
            <tr>
              <th style="width: 85px;">明细ID</th>
              <th style="width: 120px;">物料编码</th>
              <th style="width: 110px;">批次号</th>
              <th style="width: 140px;">库位编码</th>
              <th style="width: 95px;">计划数量</th>
              <th style="width: 95px;">实际数量</th>
              <th style="width: 90px;">拣货状态</th>
              <th style="width: 130px;">更新时间</th>
            </tr>
            </thead>
            <tbody id="detailTbody"></tbody>
          </table>
        </div>

        <div class="actions">
          <button id="btnUploadCurrent" type="button" class="btn">上传拣货数据</button>
          <button id="btnCompleteCurrent" type="button" class="btn success">完成（调用拣货完成）</button>
          <button id="btnControlCurrent" type="button" class="btn secondary">调用亮灯控制</button>
        </div>
        <div class="hint">流程：点击左侧波次（仅选择） -> 点击“上传拣货数据” -> 修改明细字段 -> 点击“完成”。</div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2 class="section-title">执行状态</h2>
    <div id="status" class="status">就绪，等待操作。</div>
    <div class="actions" style="margin-top:0;">
      <button id="btnClearLog" type="button" class="btn danger">清空日志</button>
    </div>
  </div>

  <div class="panel">
    <h2 class="section-title">请求 / 响应日志</h2>
    <pre id="log" class="log"></pre>
  </div>
</div>

<script>
(function () {
  var state = {
    running: false,
    activeWaveId: null,
    waveList: []
  };

  var el = {
    apiBase: document.getElementById("apiBase"),
    controlMode: document.getElementById("controlMode"),
    controlColor: document.getElementById("controlColor"),
    controlDuration: document.getElementById("controlDuration"),

    mockWaveCount: document.getElementById("mockWaveCount"),
    mockDetailCount: document.getElementById("mockDetailCount"),
    btnGenerateMockData: document.getElementById("btnGenerateMockData"),

    waveList: document.getElementById("waveList"),
    detailTitle: document.getElementById("detailTitle"),
    currentWaveNo: document.getElementById("currentWaveNo"),
    currentUserId: document.getElementById("currentUserId"),
    currentUserName: document.getElementById("currentUserName"),
    btnApplyWaveMeta: document.getElementById("btnApplyWaveMeta"),
    detailTbody: document.getElementById("detailTbody"),
    btnResetWaves: document.getElementById("btnResetWaves"),
    btnUploadCurrent: document.getElementById("btnUploadCurrent"),
    btnCompleteCurrent: document.getElementById("btnCompleteCurrent"),
    btnControlCurrent: document.getElementById("btnControlCurrent"),

    status: document.getElementById("status"),
    log: document.getElementById("log"),
    btnClearLog: document.getElementById("btnClearLog")
  };

  function defaultWaves() {
    return [
      {
        id: "W1",
        waveNo: "WV202603250001",
        userId: "USER001",
        userName: "张三",
        details: [
          { id: "DTL001", materialCode: "MAT001", batchNo: "B20260325", locationCode: "A1-11-02-01-01", planQuantity: 100, actualQuantity: 0, status: 0, updateTime: 1648195200000 },
          { id: "D3003", materialCode: "MAT-013", batchNo: "BATCH-ERR-3", locationCode: "A1-11-01-01-01", planQuantity: 6, actualQuantity: 0, status: 0, updateTime: 1648195200000 }
        ]
      },
      {
        id: "W2",
        waveNo: "WV202603250002",
        userId: "USER002",
        userName: "李四",
        details: [
          { id: "DTL101", materialCode: "MAT101", batchNo: "B20260326", locationCode: "A1-21-01-01-01", planQuantity: 8, actualQuantity: 0, status: 0, updateTime: 1648195200000 },
          { id: "DTL102", materialCode: "MAT102", batchNo: "B20260326", locationCode: "A1-21-01-02-01", planQuantity: 12, actualQuantity: 0, status: 0, updateTime: 1648195200000 }
        ]
      }
    ];
  }

  function deepClone(obj) { return JSON.parse(JSON.stringify(obj)); }

  function nowString() {
    var d = new Date();
    var h = String(d.getHours()).padStart(2, "0");
    var m = String(d.getMinutes()).padStart(2, "0");
    var s = String(d.getSeconds()).padStart(2, "0");
    var ms = String(d.getMilliseconds()).padStart(3, "0");
    return h + ":" + m + ":" + s + "." + ms;
  }

  function logLine(text) {
    el.log.textContent += "[" + nowString() + "] " + text + "\n";
    el.log.scrollTop = el.log.scrollHeight;
  }

  function setStatus(type, text) {
    var cls = "status";
    if (type === "ok") cls += " ok";
    if (type === "err") cls += " err";
    el.status.className = cls;
    el.status.textContent = text;
  }

  function getBase() {
    var raw = (el.apiBase.value || "").trim();
    if (!raw) return window.location.origin;
    return raw.replace(/\/+$/, "");
  }

  function getActiveWave() {
    for (var i = 0; i < state.waveList.length; i++) {
      if (state.waveList[i].id === state.activeWaveId) return state.waveList[i];
    }
    return null;
  }

  function renderWaveMeta() {
    var wave = getActiveWave();
    if (!wave) {
      el.currentWaveNo.value = "";
      el.currentUserId.value = "";
      el.currentUserName.value = "";
      return;
    }
    el.currentWaveNo.value = wave.waveNo || "";
    el.currentUserId.value = wave.userId || "";
    el.currentUserName.value = wave.userName || "";
  }

  function persistWaveMetaToWave(strict) {
    var wave = getActiveWave();
    if (!wave) return;
    var waveNo = (el.currentWaveNo.value || "").trim();
    var userId = (el.currentUserId.value || "").trim();
    var userName = (el.currentUserName.value || "").trim();
    if (strict) {
      if (!waveNo) throw new Error("当前波次 waveNo 不能为空");
      if (!userId) throw new Error("当前用户 userId 不能为空");
    }
    wave.waveNo = waveNo;
    wave.userId = userId;
    wave.userName = userName;
  }

  async function postJson(path, payload) {
    var url = getBase() + path;
    logLine("REQUEST  " + url + "\n" + JSON.stringify(payload, null, 2));
    var started = Date.now();
    var resp = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json;charset=UTF-8" },
      body: JSON.stringify(payload)
    });
    var cost = Date.now() - started;
    var text = await resp.text();
    var json = null;
    try { json = JSON.parse(text); } catch (e) { json = null; }
    logLine("RESPONSE status=" + resp.status + " cost=" + cost + "ms\n" + (json ? JSON.stringify(json, null, 2) : text));
    if (!resp.ok) throw new Error("HTTP " + resp.status + " - " + text);
    if (json && Number(json.code) !== 200) throw new Error("业务失败 code=" + json.code + " message=" + json.message);
    return json || text;
  }

  function readDetailRowsFromTable() {
    var wave = getActiveWave();
    if (!wave) throw new Error("请先选择波次单");
    var rows = Array.prototype.slice.call(el.detailTbody.querySelectorAll("tr"));
    return rows.map(function (tr, idx) {
      function val(key) {
        var input = tr.querySelector('[data-key="' + key + '"]');
        return input ? input.value : "";
      }
      var plan = Number(val("planQuantity"));
      var actual = Number(val("actualQuantity"));
      var statusRaw = val("status");
      var status = Number(statusRaw);
      var updateTime = Number(val("updateTime"));
      if (!val("id")) throw new Error("第" + (idx + 1) + "行 id 不能为空");
      if (!val("materialCode")) throw new Error("第" + (idx + 1) + "行 materialCode 不能为空");
      if (!val("batchNo")) throw new Error("第" + (idx + 1) + "行 batchNo 不能为空");
      if (!val("locationCode")) throw new Error("第" + (idx + 1) + "行 locationCode 不能为空");
      if (isNaN(plan) || isNaN(actual) || isNaN(updateTime)) throw new Error("第" + (idx + 1) + "行存在非数字字段");
      if (status !== 0 && status !== 1) throw new Error("第" + (idx + 1) + "行拣货状态仅支持0或1");
      return {
        id: val("id"),
        materialCode: val("materialCode"),
        batchNo: val("batchNo"),
        locationCode: val("locationCode"),
        planQuantity: plan,
        actualQuantity: actual,
        status: status,
        updateTime: updateTime
      };
    });
  }

  function persistTableToWave() {
    var wave = getActiveWave();
    if (!wave) return;
    wave.details = readDetailRowsFromTable();
  }

  function persistCurrentWaveEdits() {
    persistWaveMetaToWave(true);
    persistTableToWave();
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function renderWaveList() {
    el.waveList.innerHTML = "";
    state.waveList.forEach(function (wave) {
      var div = document.createElement("div");
      div.className = "wave-item" + (wave.id === state.activeWaveId ? " active" : "");
      div.innerHTML = '<div class="wave-main">' + wave.waveNo + '</div>'
        + '<div class="wave-sub">userId: ' + wave.userId + ' / ' + wave.userName + '</div>'
        + '<div class="wave-sub">details: ' + wave.details.length + '</div>';
      div.onclick = function () { onWaveSelected(wave.id); };
      el.waveList.appendChild(div);
    });
  }

  function renderDetailTable() {
    var wave = getActiveWave();
    if (!wave) {
      el.detailTitle.textContent = "拣货明细信息";
      el.detailTbody.innerHTML = "";
      renderWaveMeta();
      return;
    }
    el.detailTitle.textContent = "拣货明细信息 - " + wave.waveNo + " (" + wave.userId + ")";
    el.detailTbody.innerHTML = "";
    wave.details.forEach(function (d) {
      var tr = document.createElement("tr");
      tr.innerHTML = ''
        + '<td><input class="cell-input" data-key="id" value="' + escapeHtml(String(d.id || "")) + '"></td>'
        + '<td><input class="cell-input" data-key="materialCode" value="' + escapeHtml(String(d.materialCode || "")) + '"></td>'
        + '<td><input class="cell-input" data-key="batchNo" value="' + escapeHtml(String(d.batchNo || "")) + '"></td>'
        + '<td><input class="cell-input" data-key="locationCode" value="' + escapeHtml(String(d.locationCode || "")) + '"></td>'
        + '<td><input class="cell-input" data-key="planQuantity" value="' + Number(d.planQuantity || 0) + '"></td>'
        + '<td><input class="cell-input" data-key="actualQuantity" value="' + Number(d.actualQuantity || 0) + '"></td>'
        + '<td>'
        +   '<select class="cell-input" data-key="status">'
        +     '<option value="0"' + (Number(d.status || 0) === 0 ? " selected" : "") + '>0-待拣货</option>'
        +     '<option value="1"' + (Number(d.status || 0) === 1 ? " selected" : "") + '>1-已拣</option>'
        +   '</select>'
        + '</td>'
        + '<td><input class="cell-input" data-key="updateTime" value="' + Number(d.updateTime || Date.now()) + '"></td>';
      el.detailTbody.appendChild(tr);
    });
    renderWaveMeta();
  }

  async function guardedRun(name, fn) {
    if (state.running) return;
    state.running = true;
    setStatus("", "执行中: " + name);
    try {
      await fn();
      setStatus("ok", "执行完成: " + name);
    } catch (e) {
      setStatus("err", "执行失败: " + name + "\n" + e.message);
      logLine("ERROR    " + e.message);
    } finally {
      state.running = false;
    }
  }

  function uploadPayloadByWave(wave) {
    return {
      waveNo: wave.waveNo,
      userId: wave.userId,
      userName: wave.userName,
      updateTime: Date.now(),
      details: wave.details.map(function (d) {
        return {
          id: d.id,
          materialCode: d.materialCode,
          batchNo: d.batchNo,
          locationCode: d.locationCode,
          planQuantity: Number(d.planQuantity),
          actualQuantity: Number(d.actualQuantity),
          status: Number(d.status)
        };
      })
    };
  }

  function completePayloadByWave(wave) {
    return {
      waveNo: wave.waveNo,
      userId: wave.userId,
      userName: wave.userName,
      updateTime: Date.now(),
      details: wave.details.map(function (d) {
        return {
          id: d.id,
          materialCode: d.materialCode,
          batchNo: d.batchNo,
          locationCode: d.locationCode,
          planQuantity: Number(d.planQuantity),
          actualQuantity: Number(d.actualQuantity),
          updateTime: Number(d.updateTime || Date.now())
        };
      })
    };
  }

  async function uploadCurrentWave() {
    persistCurrentWaveEdits();
    var wave = getActiveWave();
    if (!wave) throw new Error("请先选择波次单");
    await postJson("/api/light/picking/upload", uploadPayloadByWave(wave));
  }

  async function completeCurrentWave() {
    persistCurrentWaveEdits();
    var wave = getActiveWave();
    if (!wave) throw new Error("请先选择波次单");
    await postJson("/api/light/picking/complete", completePayloadByWave(wave));
  }

  async function controlCurrentWave() {
    persistWaveMetaToWave(true);
    var wave = getActiveWave();
    if (!wave) throw new Error("请先选择波次单");
    var payload = {
      waveNo: wave.waveNo,
      userId: wave.userId,
      mode: Number(el.controlMode.value),
      color: el.controlColor.value,
      duration: el.controlDuration.value
    };
    await postJson("/api/light/control", payload);
  }

  async function onWaveSelected(waveId) {
    persistWaveMetaToWave(false);
    persistTableToWave();
    state.activeWaveId = waveId;
    renderWaveList();
    renderDetailTable();
  }

  function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateMockWaves(waveCount, detailCount) {
    var waves = [];
    var baseNo = 260325000;
    var users = [
      { id: "USER001", name: "张三" },
      { id: "USER002", name: "李四" },
      { id: "USER003", name: "王五" },
      { id: "USER004", name: "赵六" }
    ];

    for (var i = 0; i < waveCount; i++) {
      var user = users[i % users.length];
      var waveNo = "WV" + String(baseNo + i + 1);
      var details = [];

      for (var j = 0; j < detailCount; j++) {
        var plan = randomInt(1, 120);
        var actual = randomInt(0, plan);
        details.push({
          id: "D" + (i + 1) + String(j + 1).padStart(3, "0"),
          materialCode: "MAT" + String(randomInt(1, 999)).padStart(3, "0"),
          batchNo: "B" + randomInt(20260301, 20260331),
          locationCode: "A" + randomInt(1, 3) + "-" + String(randomInt(1, 30)).padStart(2, "0") + "-" + String(randomInt(1, 5)).padStart(2, "0") + "-" + String(randomInt(1, 3)).padStart(2, "0") + "-01",
          planQuantity: plan,
          actualQuantity: actual,
          status: actual >= plan ? 1 : 0,
          updateTime: Date.now()
        });
      }

      waves.push({
        id: "GW" + (i + 1),
        waveNo: waveNo,
        userId: user.id,
        userName: user.name,
        details: details
      });
    }

    return waves;
  }

  function applyWaves(newWaves, message) {
    state.waveList = deepClone(newWaves);
    state.activeWaveId = state.waveList.length ? state.waveList[0].id : null;
    renderWaveList();
    renderDetailTable();
    setStatus("ok", message);
  }

  function applyCurrentWaveMeta() {
    persistWaveMetaToWave(true);
    renderWaveList();
    renderDetailTable();
    setStatus("ok", "已更新当前波次基础信息。");
  }

  function resetWaves() {
    applyWaves(defaultWaves(), "已恢复默认模拟数据。");
  }

  function generateMockData() {
    var waveCount = Number(el.mockWaveCount.value);
    var detailCount = Number(el.mockDetailCount.value);
    if (isNaN(waveCount) || waveCount < 1 || waveCount > 50) {
      setStatus("err", "波次数量需在 1~50 之间");
      return;
    }
    if (isNaN(detailCount) || detailCount < 1 || detailCount > 50) {
      setStatus("err", "每波次明细数需在 1~50 之间");
      return;
    }
    applyWaves(generateMockWaves(waveCount, detailCount), "已生成模拟数据：" + waveCount + " 个波次，每波次 " + detailCount + " 条明细。");
  }

  function bindEvents() {
    el.btnGenerateMockData.onclick = generateMockData;
    el.btnResetWaves.onclick = resetWaves;
    el.btnApplyWaveMeta.onclick = function () { guardedRun("更新当前波次基础信息", applyCurrentWaveMeta); };
    el.btnUploadCurrent.onclick = function () { guardedRun("上传拣货数据", uploadCurrentWave); };
    el.btnCompleteCurrent.onclick = function () { guardedRun("拣货完成", completeCurrentWave); };
    el.btnControlCurrent.onclick = function () { guardedRun("亮灯控制", controlCurrentWave); };
    el.btnClearLog.onclick = function () { el.log.textContent = ""; };
  }

  function init() {
    el.apiBase.value = window.location.origin;
    resetWaves();
    bindEvents();
    setStatus("", "就绪：可先“生成模拟数据”，点击任一波次后手动执行“上传拣货数据”。");
  }

  init();
})();
</script>
</body>
</html>
