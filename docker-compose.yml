version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: magic-boot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-magic-boot}
      MYSQL_USER: ${MYSQL_USER:-magic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Magic@2026}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=1000
      - --max_allowed_packet=64M
    networks:
      - magic-boot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - docker-db

  redis:
    image: redis:7-alpine
    container_name: magic-boot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-Magic@Redis2026}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    networks:
      - magic-boot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Magic@Redis2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    profiles:
      - docker-db

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: magic-boot-redis-ui
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-Magic@Redis2026}
    ports:
      - "8089:8089"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - magic-boot-network
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: magic-boot-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8089}:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      - SPRING_FLYWAY_BASELINE_ON_MIGRATE=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      - SPRING_FLYWAY_PLACEHOLDER_REPLACEMENT=${SPRING_FLYWAY_PLACEHOLDER_REPLACEMENT:-false}
      - SPRING_FLYWAY_LOCATIONS=${SPRING_FLYWAY_LOCATIONS:-classpath:db/migration}
      - SERVER_PORT=8089
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://${MYSQL_HOST:-mysql}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE:-magic-boot}?useSSL=false&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF8&autoReconnect=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-magic}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-Magic@2026}
      - EXTEND_REDIS_ENABLED=${EXTEND_REDIS_ENABLED:-true}
      - SPRING_DATA_REDIS_HOST=${SPRING_DATA_REDIS_HOST:-${REDIS_HOST:-redis}}
      - SPRING_DATA_REDIS_PORT=${SPRING_DATA_REDIS_PORT:-6379}
      - SPRING_DATA_REDIS_PASSWORD=${SPRING_DATA_REDIS_PASSWORD:-${REDIS_PASSWORD:-Magic@Redis2026}}
      - SPRING_DATA_REDIS_DATABASE=${SPRING_DATA_REDIS_DATABASE:-0}
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-${REDIS_HOST:-redis}}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6379}
      - SPRING_REDIS_PASSWORD=${SPRING_REDIS_PASSWORD:-${REDIS_PASSWORD:-Magic@Redis2026}}
      - SPRING_REDIS_DATABASE=${SPRING_REDIS_DATABASE:-0}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    volumes:
      - ./data/magic-api:/app/data/magic-api:rw
      - ./uploads:/app/uploads:rw
      - ./logs:/app/logs:rw
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - magic-boot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: magic-boot-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - magic-boot-network
    profiles:
      - production

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  magic-boot-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
