# 测试环境配置
spring.application.name=magic-api-plugin-file-test

# H2 内存数据库配置（用于测试）
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# 初始化数据库
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 控制台（可选，调试用）
spring.h2.console.enabled=false

# MyBatis-Plus 配置
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=assign_uuid
mybatis-plus.global-config.db-config.logic-delete-field=isDeleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# 文件存储配置（测试用本地存储）
file.storage.local.base-path=target/test-upload/
file.storage.local.domain=http://localhost:8089

# 日志级别
logging.level.org.ssssssss.magicapi.file=DEBUG
logging.level.com.baomidou.mybatisplus=DEBUG
